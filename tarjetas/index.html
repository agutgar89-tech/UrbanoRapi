<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de Tarjetas de Crédito</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --panel-2:#fafbfc; --line:#e3e6ea;
  --tx:#1a1d21; --tx-2:#5f6672; --tx-3:#8b93a1;
  --acc:#2f6df6; --acc-soft:#e8f0ff;
  --ok:#1a8f5a; --ok-soft:#e4f6ed;
  --warn:#b7791f; --warn-soft:#fdf3e0;
  --bad:#d13b3b; --bad-soft:#fdeaea;
  --radius:12px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12151a; --panel:#1a1e25; --panel-2:#20252d; --line:#2b313b;
    --tx:#e8ebf0; --tx-2:#a3abb8; --tx-3:#767f8c;
    --acc:#5b8dff; --acc-soft:#1d2942;
    --ok:#43c98a; --ok-soft:#152c22;
    --warn:#e0a94a; --warn-soft:#302615;
    --bad:#f0716f; --bad-soft:#33191a;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
a{color:var(--acc)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 80px}

/* Header */
header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.hd{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.brand span{font-size:20px}
.hd .sp{flex:1}
nav{display:flex;gap:2px;overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
nav button{background:none;border:0;padding:8px 13px;border-radius:8px;color:var(--tx-2);
  font-size:14px;font-weight:550;cursor:pointer;white-space:nowrap}
nav button:hover{background:var(--panel-2);color:var(--tx)}
nav button.on{background:var(--acc-soft);color:var(--acc)}

/* Botones */
button.btn{background:var(--acc);color:#fff;border:0;border-radius:9px;padding:9px 15px;
  font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
button.btn:hover{filter:brightness(1.08)}
button.btn.ghost{background:var(--panel);color:var(--tx);border:1px solid var(--line)}
button.btn.ghost:hover{background:var(--panel-2);filter:none}
button.btn.danger{background:var(--bad)}
button.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.ico{background:none;border:0;color:var(--tx-3);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:14px}
.ico:hover{background:var(--panel-2);color:var(--tx)}

/* Paneles */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.card>h2{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h2 .sp{flex:1}
.sub{color:var(--tx-2);font-size:13px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}

/* KPI */
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi .lbl{font-size:12px;color:var(--tx-2);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.kpi .val{font-size:24px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .hint{font-size:12px;color:var(--tx-3);margin-top:3px}
.kpi.bad .val{color:var(--bad)} .kpi.ok .val{color:var(--ok)} .kpi.warn .val{color:var(--warn)}

/* Tarjeta de crédito */
.cc{border-radius:14px;padding:16px;color:#fff;position:relative;overflow:hidden;min-height:150px;
  display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(0,0,0,.13)}
.cc .cc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cc .cc-bank{font-size:12px;opacity:.8;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.cc .cc-name{font-size:17px;font-weight:700;margin-top:2px}
.cc .cc-num{font-family:var(--mono);font-size:13px;opacity:.75;margin-top:2px}
.cc .cc-saldo{margin-top:auto;padding-top:12px}
.cc .cc-saldo .l{font-size:11px;opacity:.8;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.cc .cc-saldo .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cc .cc-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;opacity:.9;margin-top:8px}
.cc .cc-acts{position:absolute;top:12px;right:12px;display:flex;gap:2px}
.cc .cc-acts button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:6px;
  padding:3px 7px;font-size:12px;cursor:pointer}
.cc .cc-acts button:hover{background:rgba(255,255,255,.32)}
.bar{height:5px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:3px}

/* Tablas */
.tw{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx-2);
  font-weight:650;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--panel-2)}
tbody tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px;white-space:nowrap}
.neg{color:var(--bad)} .pos{color:var(--ok)}

/* Etiquetas */
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.tag.gris{background:var(--panel-2);color:var(--tx-2);border:1px solid var(--line)}
.tag.azul{background:var(--acc-soft);color:var(--acc)}
.tag.verde{background:var(--ok-soft);color:var(--ok)}
.tag.ambar{background:var(--warn-soft);color:var(--warn)}
.tag.rojo{background:var(--bad-soft);color:var(--bad)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}

/* Formularios */
label{display:block;font-size:12px;font-weight:600;color:var(--tx-2);margin-bottom:5px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel-2);color:var(--tx);font:inherit;font-size:14px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
textarea{min-height:70px;resize:vertical;font-size:13px}
.field{margin-bottom:13px}
.fgrid{display:grid;gap:0 13px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.filtros .field{margin-bottom:0;min-width:135px}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;
  justify-content:center;z-index:100;padding:20px;overflow-y:auto}
.ov.on{display:flex}
.modal{background:var(--panel);border-radius:14px;max-width:620px;width:100%;margin:auto;
  box-shadow:0 12px 44px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal header{background:none;border:0;border-bottom:1px solid var(--line);position:static;
  padding:16px 20px;display:flex;align-items:center;gap:10px}
.modal header h3{flex:1;font-size:16px}
.modal .body{padding:18px 20px;max-height:65vh;overflow-y:auto}
.modal .foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.modal .foot .sp{flex:1}

/* Avisos */
.aviso{border-radius:10px;padding:12px 14px;font-size:13.5px;margin-bottom:11px;border:1px solid transparent;line-height:1.5}
.aviso.rojo{background:var(--bad-soft);border-color:var(--bad);color:var(--tx)}
.aviso.ambar{background:var(--warn-soft);border-color:var(--warn);color:var(--tx)}
.aviso.verde{background:var(--ok-soft);border-color:var(--ok);color:var(--tx)}
.aviso.azul{background:var(--acc-soft);border-color:var(--acc);color:var(--tx)}
.aviso b{font-weight:680}
.vacio{text-align:center;padding:34px 20px;color:var(--tx-3);font-size:14px}
.vacio p{margin:0 0 14px}

/* Barras de análisis */
.split{display:flex;height:26px;border-radius:7px;overflow:hidden;background:var(--panel-2);border:1px solid var(--line)}
.split i{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--tx-2);margin-top:9px}
.leg b{color:var(--tx)}
.mini{height:7px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.mini i{display:block;height:100%;border-radius:4px}
/* Paleta de gráficas: valores validados para contraste y daltonismo en ambos
   modos. Se definen como tokens para que el modo oscuro se cambie en un solo
   lugar y las gráficas se escriban contra el rol, no contra el hex. */
:root{ --serie1:#2a78d6; --critico:#d03b3b; --pista:#eef0f3; }
@media (prefers-color-scheme:dark){ :root{ --serie1:#3987e5; --critico:#d03b3b; --pista:#262c35; } }

/* Secciones plegables */
details.card>summary{cursor:pointer;font-size:15px;font-weight:650;letter-spacing:-.01em;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;list-style:none}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:'▸';color:var(--tx-3);font-size:12px;transition:transform .15s}
details.card[open]>summary::before{transform:rotate(90deg)}
details.card>summary:hover{color:var(--acc)}
details.card>summary .sub{font-weight:500}

/* Barras horizontales */
.chart{margin-top:4px}
.brow{display:grid;grid-template-columns:minmax(90px,190px) 1fr auto;gap:12px;align-items:center;
  padding:5px 0;border-radius:6px}
.brow:hover,.brow:focus-visible{background:var(--panel-2);outline:none}
.brow:focus-visible{box-shadow:0 0 0 2px var(--acc)}
.blab{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btrack{height:20px;background:var(--pista);border-radius:5px;overflow:hidden}
.btrack i{display:block;height:100%;border-radius:0 5px 5px 0;min-width:3px;transition:width .25s}
.bval{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;
  min-width:88px;text-align:right}

/* Columnas apiladas */
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--tx-2);margin-bottom:16px}
.leyenda span{display:flex;align-items:center;gap:6px}
.leyenda i{width:11px;height:11px;border-radius:3px;display:inline-block}
.cols{display:flex;gap:10px;align-items:flex-end;overflow-x:auto;padding-bottom:4px;min-height:250px}
.col{flex:1;min-width:56px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.cval{font-family:var(--mono);font-size:11px;color:var(--tx-2);margin-bottom:5px;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.cstack{width:100%;max-width:74px;display:flex;flex-direction:column-reverse;border-radius:5px 5px 0 0;
  overflow:hidden;min-height:3px}
/* 2px de separación entre segmentos: el borde es del color de la superficie */
.cstack i{width:100%;box-shadow:0 -2px 0 var(--panel);cursor:default}
.cstack i:first-child{box-shadow:none}
.cstack i:focus-visible{outline:2px solid var(--tx);outline-offset:-2px}
.clab{font-size:11.5px;color:var(--tx-2);margin-top:7px;white-space:nowrap}

/* Tooltip compartido */
#tip{position:fixed;background:var(--tx);color:var(--bg);padding:7px 11px;border-radius:7px;
  font-size:12.5px;pointer-events:none;z-index:300;opacity:0;transition:opacity .12s;max-width:280px;
  box-shadow:0 4px 16px rgba(0,0,0,.25);line-height:1.45}
#tip.on{opacity:1}

/* Opciones de monto al registrar un pago */
.ops{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-top:6px}
.opcion{text-align:left;background:var(--panel-2);border:2px solid var(--line);border-radius:10px;
  padding:11px 13px;cursor:pointer;font-family:inherit;color:var(--tx);display:block}
.opcion:hover{border-color:var(--acc)}
.opcion.on{border-color:var(--acc);background:var(--acc-soft)}
.opcion.malo{border-color:var(--warn)}
.opcion.malo em{color:var(--warn)}
.opcion.malo.on{border-color:var(--bad);background:var(--bad-soft)}
.opcion b{display:block;font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.opcion span{display:block;font-size:12.5px;color:var(--tx-2);margin-top:2px;font-weight:600}
.opcion em{display:block;font-size:11.5px;color:var(--tx-3);margin-top:4px;font-style:normal;line-height:1.4}

.nota{color:var(--tx-3);cursor:help;font-size:13px;margin-left:4px;border-radius:3px}
.nota:hover,.nota:focus-visible{color:var(--acc);outline:none}
.nota:focus-visible{box-shadow:0 0 0 2px var(--acc)}

select.cat{padding:5px 8px;font-size:13px;border-radius:6px;min-width:135px}
select.cat:not([value=""]){border-color:var(--line)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);
  padding:11px 20px;border-radius:9px;font-size:14px;font-weight:550;z-index:200;box-shadow:0 6px 22px rgba(0,0,0,.28);
  opacity:0;pointer-events:none;transition:opacity .18s;max-width:88vw;text-align:center}
.toast.on{opacity:1}
.hide{display:none!important}
code{font-family:var(--mono);font-size:12.5px;background:var(--panel-2);padding:1px 5px;border-radius:4px;border:1px solid var(--line)}
pre{font-family:var(--mono);font-size:12px;background:var(--panel-2);padding:12px;border-radius:8px;
  border:1px solid var(--line);overflow-x:auto;line-height:1.45}
@media(max-width:640px){
  .kpi .val{font-size:20px}
  .card{padding:14px}
  .tw{margin:0 -14px;padding:0 14px}
  /* En pantalla chica la tabla se desliza a lo ancho en vez de apilar cada
     fila en tres renglones: se lee mucho mejor de un vistazo. */
  .tw td,.tw th{white-space:nowrap}
  .tw td .sub{white-space:nowrap}
  .filtros .field{min-width:120px}
  /* En pantalla chica la etiqueta se comía el ancho y la barra quedaba en un
     muñón. Etiqueta y monto arriba; la barra abajo, a todo lo ancho. */
  .brow{grid-template-columns:1fr auto;grid-template-areas:"lab val" "track track";gap:2px 10px;
    padding:7px 0}
  .blab{grid-area:lab;white-space:normal}
  .bval{grid-area:val;min-width:0}
  .btrack{grid-area:track;height:14px}
  .btrack i{border-radius:0 4px 4px 0}
}
</style>
</head>
<body>

<header>
  <div class="hd">
    <div class="brand"><span>💳</span> Control de Tarjetas</div>
    <div class="sp"></div>
    <nav id="nav">
      <button data-t="resumen" class="on">Resumen</button>
      <button data-t="tarjetas">Tarjetas</button>
      <button data-t="movs">Movimientos</button>
      <button data-t="gastos">En qué gasto</button>
      <button data-t="cortes">Estados de cuenta</button>
      <button data-t="ingresos">Ingresos</button>
      <button data-t="analisis">¿Por qué no baja?</button>
      <button data-t="datos">Datos</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <section id="tab-resumen"></section>
  <section id="tab-tarjetas" class="hide"></section>
  <section id="tab-movs" class="hide"></section>
  <section id="tab-gastos" class="hide"></section>
  <section id="tab-cortes" class="hide"></section>
  <section id="tab-ingresos" class="hide"></section>
  <section id="tab-analisis" class="hide"></section>
  <section id="tab-datos" class="hide"></section>
</div>

<div class="ov" id="ov">
  <div class="modal">
    <header><h3 id="mTitulo">Título</h3><button class="ico" onclick="cerrarModal()">✕</button></header>
    <div class="body" id="mBody"></div>
    <div class="foot" id="mFoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="tip"></div>

<script>
/* ==========================================================================
   CONTROL DE TARJETAS DE CRÉDITO — app de un solo archivo, sin dependencias.
   Los datos viven en localStorage y se respaldan a un archivo JSON.
   ========================================================================== */

const LLAVE = 'tarjetas-credito-v1';
const IVA = 0.16;                 // IVA sobre intereses y comisiones (México)
const COLORES = ['#1f4e8c','#7a1f3d','#1f6b4a','#5b3a8c','#8c5a1f','#0f5f6b','#6b1f1f','#2d3748'];

/* Tipos de movimiento.
   suma = cómo afecta la deuda: +1 la sube, -1 la baja.
   pago = si además salió dinero de tu bolsa. Un cashback y un diferimiento a
   meses bajan el saldo del corte pero no son dinero que tú abonaste, y
   contarlos como abono inflaría lo que crees haber pagado. */
const TIPOS = {
  compra:      {etiqueta:'Compra',               suma:+1, pago:false, clase:'gris'},
  disposicion: {etiqueta:'Disposición efectivo', suma:+1, pago:false, clase:'ambar'},
  mensualidad: {etiqueta:'Mensualidad a meses',  suma:+1, pago:false, clase:'azul'},
  interes:     {etiqueta:'Intereses',            suma:+1, pago:false, clase:'rojo'},
  iva:         {etiqueta:'IVA de intereses',     suma:+1, pago:false, clase:'rojo'},
  comision:    {etiqueta:'Comisión',             suma:+1, pago:false, clase:'rojo'},
  anualidad:   {etiqueta:'Anualidad',            suma:+1, pago:false, clase:'rojo'},
  abono:       {etiqueta:'Abono / Pago',         suma:-1, pago:true,  clase:'verde'},
  bonificacion:{etiqueta:'Bonificación',         suma:-1, pago:false, clase:'verde'},
  diferimiento:{etiqueta:'Diferido a meses',     suma:-1, pago:false, clase:'azul'},
};
/* ¿Este movimiento es dinero que tú pagaste? */
const esPago = m => !!(TIPOS[m.tipo] || {}).pago;
/* ¿Baja el saldo del corte, lo hayas pagado tú o no? */
const bajaSaldo = m => (TIPOS[m.tipo] || {}).suma === -1;
/* Lo que el banco te cobra por deber dinero: esto es lo que hace que no baje la deuda. */
const TIPOS_COSTO = ['interes','iva','comision','anualidad'];
const CATS_BASE = ['Súper','Comida','Gasolina','Transporte','Servicios','Suscripciones',
  'Salud','Ropa','Hogar','Ferretería','Mascota','Entretenimiento','Educación','Negocio',
  'Viajes','Efectivo','Otros'];
/* Las categorías base más las que tú agregues. */
function CATEGORIAS(){
  return [...new Set([...CATS_BASE, ...(D.categorias||[])])].sort((a,b)=>a.localeCompare(b,'es'));
}
/* Clave con la que se recuerda a qué categoría pertenece un concepto.
   El banco escribe el mismo comercio con variaciones de espacios y mayúsculas. */
const claveConcepto = c => String(c||'').toUpperCase().replace(/\s+/g,' ').trim();

let D = cargar();       // estado completo
let tabActual = 'resumen';

/* ---------- Persistencia ---------- */
function estadoVacio(){
  return {version:1, tarjetas:[], movimientos:[], periodos:[], ingresos:[],
          categorias:[],   // las que tú agregas
          reglas:{},       // concepto -> categoría, para no volver a clasificarlo a mano
          creado:hoyISO(), actualizado:hoyISO()};
}
function cargar(){
  try{
    const raw = localStorage.getItem(LLAVE);
    if(!raw) return estadoVacio();
    const d = JSON.parse(raw);
    return Object.assign(estadoVacio(), d);
  }catch(e){
    console.error('No se pudo leer el almacenamiento:', e);
    return estadoVacio();
  }
}
function guardar(){
  D.actualizado = hoyISO();
  try{ localStorage.setItem(LLAVE, JSON.stringify(D)); }
  catch(e){ aviso('⚠️ No se pudo guardar. Exporta tu respaldo JSON.'); }
}

/* ---------- Utilidades ---------- */
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const num = v => { const n = parseFloat(String(v ?? '').replace(/[^0-9.-]/g,'')); return isNaN(n)?0:n; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

/* Formatea un monto. Los negativos se muestran con signo: si tu deuda subió
   en vez de bajar, el número tiene que decirlo. */
function money(n){
  const v = num(n);
  const s = '$' + Math.abs(v).toLocaleString('es-MX',{minimumFractionDigits:2, maximumFractionDigits:2});
  return v < 0 ? '−' + s : s;
}
/* Cuántos meses distintos traen cargos de intereses o comisiones. */
function mesesConCosto(){
  const m = new Set(D.movimientos.filter(x => TIPOS_COSTO.includes(x.tipo))
    .map(x => (x.fecha||'').slice(0,7)).filter(Boolean));
  return m.size || 1;
}
function pct(n){ return (num(n)*100).toFixed(1).replace(/\.0$/,'') + '%'; }

function hoyISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
/* Fechas siempre en horario local para que no se recorra un día. */
function aFecha(iso){
  if(!iso) return null;
  const [a,m,d] = String(iso).slice(0,10).split('-').map(Number);
  if(!a || !m || !d) return null;
  return new Date(a, m-1, d);
}
function aISO(f){
  if(!f) return '';
  return `${f.getFullYear()}-${String(f.getMonth()+1).padStart(2,'0')}-${String(f.getDate()).padStart(2,'0')}`;
}
function fechaCorta(iso){
  const f = aFecha(iso); if(!f) return '—';
  const M = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${f.getDate()} ${M[f.getMonth()]} ${String(f.getFullYear()).slice(2)}`;
}
function mesLargo(ym){
  const M = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const [a,m] = ym.split('-').map(Number);
  return `${M[m-1]} ${a}`;
}
function diasEntre(isoA, isoB){
  const a = aFecha(isoA), b = aFecha(isoB);
  if(!a || !b) return null;
  return Math.round((b - a) / 86400000);
}
function sumaDias(iso, n){
  const f = aFecha(iso); if(!f) return '';
  f.setDate(f.getDate() + n);
  return aISO(f);
}
/* Día del mes ajustado: si pides el 31 en febrero te da el último día real. */
function diaDelMes(anio, mes, dia){
  const ultimo = new Date(anio, mes+1, 0).getDate();
  return new Date(anio, mes, Math.min(dia, ultimo));
}
function aviso(txt, ms){
  const t = $('toast'); t.textContent = txt; t.classList.add('on');
  clearTimeout(t._id); t._id = setTimeout(()=>t.classList.remove('on'), ms || 2600);
}

/* ---------- Consultas sobre el estado ---------- */
const tarjeta   = id => D.tarjetas.find(t => t.id === id);
const nomTarjeta= id => (tarjeta(id) || {}).nombre || 'Tarjeta borrada';
const colTarjeta= id => (tarjeta(id) || {}).color || '#888';

function movsDe(tarjetaId){
  return D.movimientos.filter(m => m.tarjetaId === tarjetaId);
}
function ordenados(lista){
  return [...lista].sort((a,b) => (b.fecha||'').localeCompare(a.fecha||'') || (b.creado||'').localeCompare(a.creado||''));
}
/* Efecto de un movimiento sobre la deuda (positivo sube, negativo baja). */
function efecto(m){
  const t = TIPOS[m.tipo] || TIPOS.compra;
  return t.suma * Math.abs(num(m.monto));
}

/* Saldo actual de una tarjeta: lo que debes en total.
   Si hay un estado de cuenta cargado, partimos de su saldo final (que es la
   verdad del banco) y sumamos sólo lo que pasó después. Así el saldo no se
   deforma por movimientos capturados a medias antes de ese corte.
   Incluye el saldo diferido a meses: todavía no te lo exigen este corte,
   pero lo debes igual. */
function saldoTarjeta(id){
  const cortes = periodosDe(id);
  const ultimo = cortes[0];  // el más reciente
  if(ultimo){
    const posteriores = movsDe(id).filter(m => m.corte
      ? m.corte > ultimo.fechaCorte
      : (m.fecha||'') > ultimo.fechaCorte);
    return num(ultimo.saldoNuevo) + num(ultimo.saldoDiferido)
           + posteriores.reduce((s,m) => s + efecto(m), 0);
  }
  return movsDe(id).reduce((s,m) => s + efecto(m), 0);
}
/* Lo exigible en el corte más reciente, sin contar lo diferido a meses. */
function saldoExigible(id){
  const ultimo = periodosDe(id)[0];
  if(!ultimo) return saldoTarjeta(id);
  return saldoTarjeta(id) - num(ultimo.saldoDiferido);
}
function periodosDe(id){
  return D.periodos.filter(p => p.tarjetaId === id)
    .sort((a,b) => (b.fechaCorte||'').localeCompare(a.fechaCorte||''));
}
/* Movimientos que caen dentro de un periodo.
   Si el movimiento trae `corte` (viene de un estado de cuenta importado), manda
   ese dato: los bancos imprimen compras con fecha anterior al corte en el
   estado de cuenta del mes siguiente, y la fecha de la transacción mentiría.
   Si no lo trae (captura manual), se ubica por fecha. */
function movsDelPeriodo(p){
  const previos = periodosDe(p.tarjetaId).filter(x => (x.fechaCorte||'') < (p.fechaCorte||''));
  const desde = previos.length ? sumaDias(previos[0].fechaCorte, 1) : '0000-01-01';
  return movsDe(p.tarjetaId).filter(m => m.corte
    ? m.corte === p.fechaCorte
    : (m.fecha||'') >= desde && (m.fecha||'') <= (p.fechaCorte||''));
}
/* Abonos que corresponden a un corte: todo lo pagado desde ese corte hasta el
   siguiente. Se separan en puntuales (dentro de la fecha límite) y tardíos,
   porque un pago hecho un día después sí bajó tu deuda, pero ya no te salvó
   de los intereses. Contarlo como "sin pagar" sería mentirte. */
function abonosDelPeriodo(p){
  const posteriores = periodosDe(p.tarjetaId).filter(x => (x.fechaCorte||'') > (p.fechaCorte||''));
  const hasta = posteriores.length ? posteriores[posteriores.length-1].fechaCorte : '9999-12-31';
  return movsDe(p.tarjetaId).filter(m => esPago(m) &&
    (m.fecha||'') > (p.fechaCorte||'') &&
    (m.fecha||'') <= hasta);
}

/* Conciliación: ¿el saldo que te cobra el banco cuadra con los movimientos?
   saldo anterior + cargos - abonos debería ser igual al saldo nuevo. */
function conciliar(p){
  const movs = movsDelPeriodo(p);
  const cargos = movs.filter(m => (TIPOS[m.tipo]||{}).suma === +1).reduce((s,m)=>s+Math.abs(num(m.monto)),0);
  const abonos = movs.filter(m => (TIPOS[m.tipo]||{}).suma === -1).reduce((s,m)=>s+Math.abs(num(m.monto)),0);
  const costos = movs.filter(m => TIPOS_COSTO.includes(m.tipo)).reduce((s,m)=>s+Math.abs(num(m.monto)),0);
  const esperado = num(p.saldoAnterior) + cargos - abonos;
  const dif = num(p.saldoNuevo) - esperado;
  return {movs, cargos, abonos, costos, esperado, dif, cuadra: Math.abs(dif) < 1};
}

/* El mínimo que de verdad te deja tranquilo.
   Cuando traes compras a meses, el estado de cuenta trae dos mínimos: el
   "pago mínimo" a secas y el "pago mínimo + compras y cargos diferidos a
   meses". Pagar sólo el primero deja sin cubrir la mensualidad, y el propio
   contrato dice que entonces esas compras empiezan a generar intereses
   ordinarios: un saldo a meses sin intereses se convierte en uno con ellos.
   Así que el piso real es el segundo. */
function minimoEfectivo(p){
  return num(p.pagoMinimoConMeses) || num(p.pagoMinimo);
}

/* Estado del pago de un corte: ¿alcanzó para no generar intereses?
   Sólo los abonos puntuales cuentan para librarte del interés; los tardíos
   se reportan aparte porque sí bajaron el saldo. */
function estadoPago(p){
  const limite = p.fechaLimitePago || sumaDias(p.fechaCorte, 20);
  const todos = abonosDelPeriodo(p);
  const suma = arr => arr.reduce((s,m)=>s+Math.abs(num(m.monto)),0);
  const puntuales = todos.filter(m => (m.fecha||'') <= limite);
  const tardios   = todos.filter(m => (m.fecha||'') >  limite);
  const pagado = suma(puntuales), tardio = suma(tardios);
  const noInt = num(p.pagoNoIntereses) || num(p.saldoNuevo);
  const minBase = num(p.pagoMinimo);
  const min = minimoEfectivo(p);
  const hayMeses = num(p.pagoMinimoConMeses) > minBase + 0.01;
  const venceEn = diasEntre(hoyISO(), limite);
  let clave, etiqueta, clase;
  if(pagado <= 0 && tardio > 0){
    clave='tardio'; etiqueta='Pagado fuera de fecha'; clase='rojo';
  }else if(pagado <= 0){
    clave = venceEn !== null && venceEn < 0 ? 'vencido' : 'pendiente';
    etiqueta = clave === 'vencido' ? 'Sin pagar · vencido' : 'Sin pagar';
    clase = clave === 'vencido' ? 'rojo' : 'ambar';
  }else if(pagado + 0.99 >= noInt){
    clave='total'; etiqueta='Pagado total · sin intereses'; clase='verde';
  }else if(min > 0 && pagado + 0.99 >= min){
    clave='minimo'; etiqueta='Sólo el mínimo · genera intereses'; clase='ambar';
  }else if(hayMeses && minBase > 0 && pagado + 0.99 >= minBase){
    /* Cubrió el mínimo a secas pero no la mensualidad de las compras a meses. */
    clave='sinMensualidad'; etiqueta='No cubrió la mensualidad a meses'; clase='rojo';
  }else{
    clave='parcial'; etiqueta='Pago parcial · genera intereses'; clase='rojo';
  }
  /* Lo que pagaste de más. No se pierde ni se queda el banco con él: baja el
     saldo del corte siguiente. Como el estado de cuenta lo mete dentro de un
     solo renglón de "pagos y abonos", desaparece de la vista — y entonces uno
     no entiende por qué el siguiente corte no bajó lo que esperaba. */
  const excedente = Math.max(0, pagado + tardio - noInt);
  return {pagado, tardio, total: pagado + tardio, puntuales, tardios, noInt,
          min, minBase, hayMeses, excedente,
          faltante: Math.max(0, noInt - pagado), venceEn, clave, etiqueta, clase};
}

/* El corte que sigue a uno dado, si ya está cargado. */
function corteSiguiente(p){
  const posteriores = periodosDe(p.tarjetaId)
    .filter(x => (x.fechaCorte||'') > (p.fechaCorte||''));
  return posteriores.length ? posteriores[posteriores.length-1] : null;
}

/* Próximo corte y próxima fecha de pago según la configuración de la tarjeta. */
function proximasFechas(t){
  if(!t.diaCorte) return null;
  const hoy = aFecha(hoyISO());
  let corte = diaDelMes(hoy.getFullYear(), hoy.getMonth(), t.diaCorte);
  if(corte < hoy) corte = diaDelMes(hoy.getFullYear(), hoy.getMonth()+1, t.diaCorte);
  const dias = num(t.diasParaPagar) || 20;
  return {corte: aISO(corte), pago: sumaDias(aISO(corte), dias),
          faltanCorte: diasEntre(hoyISO(), aISO(corte)),
          faltanPago: diasEntre(hoyISO(), sumaDias(aISO(corte), dias))};
}
/* Interés estimado del próximo mes si no liquidas el saldo. */
function interesEstimado(t, saldo){
  const tasa = num(t.tasaAnual)/100/12;
  if(tasa <= 0 || saldo <= 0) return 0;
  return saldo * tasa * (1 + IVA);
}
</script>

<script>
/* ==========================================================================
   Navegación y ventanas modales
   ========================================================================== */
const TABS = ['resumen','tarjetas','movs','gastos','cortes','ingresos','analisis','datos'];

function ir(t){
  tabActual = t;
  TABS.forEach(x => $('tab-'+x).classList.toggle('hide', x !== t));
  [...$('nav').children].forEach(b => b.classList.toggle('on', b.dataset.t === t));
  render();
  window.scrollTo({top:0});
}
$('nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-t]');
  if(b) ir(b.dataset.t);
});

let accionesModal = {};
function modal(titulo, html, botones){
  $('mTitulo').textContent = titulo;
  $('mBody').innerHTML = html;
  accionesModal = {};
  $('mFoot').innerHTML = (botones||[]).map((b,i) => {
    accionesModal['b'+i] = b.accion;
    return b.espacio ? '<div class="sp"></div>' :
      `<button class="btn ${b.clase||'ghost'}" data-a="b${i}">${esc(b.texto)}</button>`;
  }).join('');
  $('ov').classList.add('on');
  const primero = $('mBody').querySelector('input,select,textarea');
  if(primero) setTimeout(()=>primero.focus(), 60);
}
function cerrarModal(){ $('ov').classList.remove('on'); }
$('mFoot').addEventListener('click', e => {
  const b = e.target.closest('button[data-a]');
  if(b && accionesModal[b.dataset.a]) accionesModal[b.dataset.a]();
});
$('ov').addEventListener('click', e => { if(e.target === $('ov')) cerrarModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') cerrarModal(); });

function confirmar(titulo, texto, alConfirmar){
  modal(titulo, `<p style="margin:0;line-height:1.6">${texto}</p>`, [
    {texto:'Cancelar', accion: cerrarModal},
    {texto:'Sí, continuar', clase:'danger', accion: () => { cerrarModal(); alConfirmar(); }},
  ]);
}
/* Lee los campos [name] del modal en un objeto. */
function leerForm(){
  const o = {};
  $('mBody').querySelectorAll('[name]').forEach(el => {
    o[el.name] = el.type === 'checkbox' ? el.checked : el.value.trim();
  });
  return o;
}
function opciones(lista, sel, vacio){
  const arr = vacio ? [{v:'', t:vacio}] : [];
  lista.forEach(x => arr.push(typeof x === 'string' ? {v:x, t:x} : x));
  return arr.map(o => `<option value="${esc(o.v)}"${o.v===sel?' selected':''}>${esc(o.t)}</option>`).join('');
}
const selTarjetas = (sel, vacio) =>
  opciones(D.tarjetas.map(t => ({v:t.id, t:t.nombre})), sel, vacio);

/* ==========================================================================
   Categorías: asignación manual y reglas que se recuerdan
   ========================================================================== */

/* Cuántos movimientos comparten un concepto. */
function movsDelConcepto(concepto){
  const k = claveConcepto(concepto);
  return D.movimientos.filter(m => claveConcepto(m.descripcion) === k);
}
/* Aplica una categoría a un solo movimiento. */
function ponerCategoria(id, cat){
  const m = D.movimientos.find(x => x.id === id);
  if(!m) return;
  m.categoria = cat;
  guardar();
}
/* Aplica una categoría a todos los movimientos de un concepto y guarda la regla
   para que las próximas importaciones ya lleguen clasificadas. */
function aplicarAConcepto(concepto, cat){
  const k = claveConcepto(concepto);
  let n = 0;
  D.movimientos.forEach(m => { if(claveConcepto(m.descripcion) === k){ m.categoria = cat; n++; } });
  if(cat) D.reglas[k] = cat; else delete D.reglas[k];
  guardar();
  return n;
}
/* Pide el nombre de una categoría nueva y la registra. */
function nuevaCategoria(alGuardar){
  modal('Nueva categoría', `
    <div class="field"><label>Nombre de la categoría</label>
      <input name="nombre" placeholder="Ej. Ferretería, Mascota, Negocio" maxlength="28"></div>
    <p class="sub" style="margin:0">Se agrega a la lista y queda disponible para todos tus movimientos.</p>
  `, [{texto:'Cancelar', accion:cerrarModal},
      {texto:'Agregar', clase:'', accion:()=>{
        const v = leerForm().nombre.trim();
        if(!v) return aviso('Escribe un nombre');
        if(!CATEGORIAS().includes(v)){ D.categorias = [...(D.categorias||[]), v]; guardar(); }
        cerrarModal(); alGuardar(v);
      }}]);
}

/* El <select> de categoría que aparece en cada fila de movimientos. */
function selectorCategoria(m){
  const opts = opciones(CATEGORIAS(), m.categoria || '', 'Sin categoría');
  return `<select class="cat" data-id="${m.id}" data-con="${esc(m.descripcion||'')}"
    onchange="cambioCategoria(this)">${opts}<option value="__nueva">＋ Nueva categoría…</option></select>`;
}

/* Al cambiar una categoría, si el concepto se repite ofrecemos aplicarla a
   todos: son 7 movimientos de "MERPAGO*MARIANOJAIRGU", no siete decisiones. */
function cambioCategoria(el){
  const id = el.dataset.id, concepto = el.dataset.con, cat = el.value;
  if(cat === '__nueva'){
    const previa = (D.movimientos.find(x=>x.id===id)||{}).categoria || '';
    el.value = previa;
    nuevaCategoria(nom => { el.value = nom; cambioCategoria(el); });
    return;
  }
  const hermanos = movsDelConcepto(concepto).filter(x => x.id !== id);
  if(hermanos.length === 0 || !cat){ ponerCategoria(id, cat); render(); return; }
  ponerCategoria(id, cat);
  modal('Aplicar a todo el concepto', `
    <p style="margin:0 0 14px;line-height:1.6">Tienes <b>${hermanos.length + 1} movimientos</b> de
      <b>${esc(concepto)}</b>, por <b>${money(movsDelConcepto(concepto).reduce((s,x)=>s+num(x.monto),0))}</b>.</p>
    <div class="aviso azul" style="margin:0">Si los clasificas todos como <b>${esc(cat)}</b>, además guardo
      la regla: los próximos estados de cuenta que traigan este concepto llegarán ya clasificados.</div>
  `, [{texto:'Sólo éste', accion:()=>{ cerrarModal(); render(); }},
      {texto:`Los ${hermanos.length + 1}`, clase:'', accion:()=>{
        const n = aplicarAConcepto(concepto, cat);
        cerrarModal(); render(); aviso(`${n} movimientos clasificados como ${cat} ✓`);
      }}]);
}

function render(){
  const f = {resumen:vResumen, tarjetas:vTarjetas, movs:vMovs, gastos:vGastos, cortes:vCortes,
             ingresos:vIngresos, analisis:vAnalisis, datos:vDatos}[tabActual];
  if(f) $('tab-'+tabActual).innerHTML = f();
}
function refrescar(){ guardar(); render(); }

/* ==========================================================================
   Bloques reutilizables
   ========================================================================== */
function kpi(lbl, val, hint, clase){
  return `<div class="kpi ${clase||''}"><div class="lbl">${esc(lbl)}</div>
    <div class="val">${val}</div>${hint?`<div class="hint">${hint}</div>`:''}</div>`;
}
function vacioMsg(texto, boton){
  return `<div class="vacio"><p>${texto}</p>${boton||''}</div>`;
}
function pintaTarjeta(t, conAcciones){
  const saldo = saldoTarjeta(t.id);
  const lim = num(t.limite);
  const uso = lim > 0 ? Math.min(1, saldo/lim) : 0;
  const fechas = proximasFechas(t);
  const dif = num((periodosDe(t.id)[0]||{}).saldoDiferido);
  return `<div class="cc" style="background:linear-gradient(135deg, ${t.color} 0%, ${sombrear(t.color,-22)} 100%)">
    ${conAcciones ? `<div class="cc-acts">
      <button onclick="formTarjeta('${t.id}')" title="Editar">✎</button>
      <button onclick="borrarTarjeta('${t.id}')" title="Eliminar">🗑</button></div>` : ''}
    <div class="cc-top"><div>
      <div class="cc-bank">${esc(t.banco||'')}</div>
      <div class="cc-name">${esc(t.nombre)}</div>
      ${t.ultimos4 ? `<div class="cc-num">•••• ${esc(t.ultimos4)}</div>` : ''}
    </div></div>
    <div class="cc-saldo">
      <div class="l">Debes hoy</div>
      <div class="v">${money(saldo)}</div>
      ${dif > 0 ? `<div class="cc-meta"><span>Exigible al corte ${money(saldo-dif)}</span>
        <span>A meses ${money(dif)}</span></div>` : ''}
      ${lim > 0 ? `<div class="bar"><i style="width:${(uso*100).toFixed(1)}%"></i></div>
        <div class="cc-meta"><span>Límite ${money(lim)}</span><span>Usado ${pct(uso)}</span>
        <span>Disponible ${money(Math.max(0, lim - saldo))}</span></div>` : ''}
      ${fechas ? `<div class="cc-meta"><span>Corte ${fechaCorta(fechas.corte)}</span>
        <span>Pago ${fechaCorta(fechas.pago)}</span>
        ${t.tasaAnual ? `<span>${num(t.tasaAnual)}% anual</span>` : ''}</div>` : ''}
    </div></div>`;
}
/* Oscurece o aclara un color hex para el degradado de la tarjeta. */
function sombrear(hex, p){
  const h = String(hex||'#888').replace('#','');
  const v = h.length === 3 ? h.split('').map(c=>c+c).join('') : h;
  const n = parseInt(v, 16);
  const cl = x => Math.max(0, Math.min(255, x));
  const r = cl((n>>16) + p), g = cl(((n>>8)&255) + p), b = cl((n&255) + p);
  return '#' + ((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}
</script>

<script>
/* ==========================================================================
   VISTA: Resumen
   ========================================================================== */
function vResumen(){
  if(!D.tarjetas.length){
    return `<div class="card">
      <h2>Empecemos por ordenar el desmadre</h2>
      <p class="sub" style="margin:0 0 16px;max-width:640px">Da de alta tus tarjetas una por una con su
      límite, día de corte, días para pagar y tasa de interés. Después cargas los estados de cuenta y
      capturas los abonos: aquí vas a ver, corte por corte, cuánto de lo que pagas se va a intereses
      y cuánto realmente baja tu deuda.</p>
      <button class="btn" onclick="formTarjeta()">+ Agregar mi primera tarjeta</button></div>`;
  }
  const deuda = D.tarjetas.reduce((s,t) => s + saldoTarjeta(t.id), 0);
  const limite = D.tarjetas.reduce((s,t) => s + num(t.limite), 0);
  const mes = hoyISO().slice(0,7);
  const delMes = D.movimientos.filter(m => (m.fecha||'').startsWith(mes));
  const gastoMes = delMes.filter(m => ['compra','disposicion'].includes(m.tipo))
    .reduce((s,m)=>s+Math.abs(num(m.monto)),0);
  const abonoMes = delMes.filter(esPago).reduce((s,m)=>s+Math.abs(num(m.monto)),0);
  const costoMes = delMes.filter(m => TIPOS_COSTO.includes(m.tipo))
    .reduce((s,m)=>s+Math.abs(num(m.monto)),0);
  const ingresoMes = D.ingresos.filter(i => (i.fecha||'').startsWith(mes))
    .reduce((s,i)=>s+num(i.monto),0);

  /* Avisos: cortes que ya vencieron o están por vencer sin pago suficiente. */
  const avisos = [];
  D.periodos.forEach(p => {
    const e = estadoPago(p);
    if(e.venceEn === null) return;
    if(e.clave === 'total') return;
    if(e.venceEn < 0 && e.venceEn > -60 && e.total <= 0){
      avisos.push(`<div class="aviso rojo">🔴 <b>${esc(nomTarjeta(p.tarjetaId))}</b> — el pago del corte del
        ${fechaCorta(p.fechaCorte)} venció el ${fechaCorta(p.fechaLimitePago)} y no tienes abonos registrados.
        Debías ${money(p.pagoNoIntereses||p.saldoNuevo)}.
        <button class="btn sm" style="margin-left:8px"
          onclick="formPago('${p.tarjetaId}','${p.id}')">Ya lo pagué</button></div>`);
    }else if(e.venceEn >= 0 && e.venceEn <= 12){
      avisos.push(`<div class="aviso ${e.venceEn<=3?'rojo':'ambar'}">${e.venceEn<=3?'🔴':'🟡'}
        <b>${esc(nomTarjeta(p.tarjetaId))}</b> — vence en <b>${e.venceEn} día${e.venceEn===1?'':'s'}</b>
        (${fechaCorta(p.fechaLimitePago)}). Para no generar intereses te faltan
        <b>${money(e.faltante)}</b> de ${money(e.noInt)}.
        <button class="btn sm" style="margin-left:8px"
          onclick="formPago('${p.tarjetaId}','${p.id}')">Ya lo pagué</button></div>`);
    }
  });
  /* Cortes por venir según la configuración de cada tarjeta. */
  const agenda = D.tarjetas.map(t => ({t, f: proximasFechas(t)})).filter(x => x.f)
    .sort((a,b) => a.f.corte.localeCompare(b.f.corte));

  const ultimos = ordenados(D.movimientos).slice(0,12);

  return `
  <div class="grid g4" style="margin-bottom:16px">
    ${kpi('Deuda total', money(deuda), limite>0 ? `de ${money(limite)} de límite · ${pct(limite?deuda/limite:0)} usado` : '', deuda>0?'bad':'ok')}
    ${kpi('Gastado este mes', money(gastoMes), `${mesLargo(mes)}`)}
    ${kpi('Abonado este mes', money(abonoMes), abonoMes>0 && costoMes>0 ? `${pct(costoMes/abonoMes)} se fue a intereses` : 'pagos y bonificaciones', 'ok')}
    ${kpi('Costo del banco este mes', money(costoMes), 'intereses, IVA, comisiones y anualidades', costoMes>0?'bad':'')}
  </div>

  ${avisos.length ? `<div class="card"><h2>⚠️ Atención</h2>${avisos.join('')}</div>` : ''}

  ${ingresoMes>0 ? `<div class="card"><h2>Tu mes en números <span class="sub">${mesLargo(mes)}</span></h2>
    <div class="grid g3">
      ${kpi('Ingresos', money(ingresoMes))}
      ${kpi('Gasto con tarjeta', money(gastoMes), ingresoMes?`${pct(gastoMes/ingresoMes)} de tu ingreso`:'')}
      ${kpi('Abonos a tarjetas', money(abonoMes), ingresoMes?`${pct(abonoMes/ingresoMes)} de tu ingreso`:'')}
    </div>
    ${gastoMes+abonoMes > ingresoMes ? `<div class="aviso ambar" style="margin:14px 0 0">🟡 Este mes
      gastaste y abonaste <b>${money(gastoMes+abonoMes)}</b> contra <b>${money(ingresoMes)}</b> de ingresos.
      Así la deuda crece aunque estés pagando.</div>` : ''}
  </div>` : ''}

  <div class="card"><h2>Mis tarjetas <span class="sp"></span>
    <button class="btn sm" onclick="formTarjeta()">+ Tarjeta</button>
    <button class="btn sm ghost" onclick="formMovimiento()">+ Movimiento</button></h2>
    <div class="grid g2">${D.tarjetas.map(t => pintaTarjeta(t, false)).join('')}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
      ${D.tarjetas.map(t => `<button class="btn sm ghost" onclick="formPago('${t.id}')">
        💵 Registrar pago · ${esc(t.nombre)}</button>`).join('')}
    </div>
  </div>

  ${agenda.length ? `<div class="card"><h2>Calendario de cortes y pagos</h2>
    <div class="tw"><table>
      <thead><tr><th>Tarjeta</th><th>Próximo corte</th><th>Fecha límite de pago</th>
        <th class="num">Debes hoy</th><th class="num">Interés si no liquidas</th></tr></thead>
      <tbody>${agenda.map(({t,f}) => {
        const s = saldoTarjeta(t.id);
        return `<tr>
          <td><span class="dot" style="background:${t.color}"></span>${esc(t.nombre)}</td>
          <td>${fechaCorta(f.corte)} <span class="sub">en ${f.faltanCorte}d</span></td>
          <td>${fechaCorta(f.pago)} <span class="sub">en ${f.faltanPago}d</span></td>
          <td class="num">${money(s)}</td>
          <td class="num ${interesEstimado(t,s)>0?'neg':''}">${t.tasaAnual? money(interesEstimado(t,s)) : '—'}</td>
        </tr>`;}).join('')}</tbody></table></div>
    <p class="sub" style="margin:12px 0 0">El interés estimado usa tu tasa anual entre 12 más el ${pct(IVA)} de IVA.
    Es lo que te van a cobrar el próximo corte si no liquidas el saldo completo.</p>
  </div>` : ''}

  ${ultimos.length ? `<div class="card"><h2>Últimos movimientos <span class="sp"></span>
    <button class="btn sm ghost" onclick="ir('movs')">Ver todos</button></h2>
    <div class="tw"><table>
      <thead><tr><th>Fecha</th><th>Concepto</th><th>Tarjeta</th><th>Tipo</th><th class="num">Monto</th></tr></thead>
      <tbody>${ultimos.map(m => filaMov(m)).join('')}</tbody></table></div>
  </div>` : ''}`;
}

/* ==========================================================================
   VISTA: Tarjetas
   ========================================================================== */
function vTarjetas(){
  if(!D.tarjetas.length)
    return `<div class="card">${vacioMsg('Todavía no tienes tarjetas registradas.',
      '<button class="btn" onclick="formTarjeta()">+ Agregar tarjeta</button>')}</div>`;

  return `<div class="card"><h2>Mis tarjetas <span class="sp"></span>
    <button class="btn sm" onclick="formTarjeta()">+ Tarjeta</button></h2>
    <div class="grid g2">${D.tarjetas.map(t => pintaTarjeta(t, true)).join('')}</div></div>
  ${D.tarjetas.map(fichaTarjeta).join('')}`;
}
function fichaTarjeta(t){
  const saldo = saldoTarjeta(t.id);
  const movs = movsDe(t.id);
  const cortes = periodosDe(t.id);
  const costo = movs.filter(m => TIPOS_COSTO.includes(m.tipo)).reduce((s,m)=>s+Math.abs(num(m.monto)),0);
  const abonado = movs.filter(esPago).reduce((s,m)=>s+Math.abs(num(m.monto)),0);
  const f = proximasFechas(t);
  return `<div class="card">
    <h2><span class="dot" style="background:${t.color}"></span>${esc(t.nombre)}
      <span class="sub">${esc(t.banco||'')}</span><span class="sp"></span>
      <button class="btn sm" onclick="formPago('${t.id}')">💵 Registrar pago</button>
      <button class="btn sm ghost" onclick="formMovimiento(null,'${t.id}')">+ Movimiento</button>
      <button class="btn sm ghost" onclick="formPeriodo(null,'${t.id}')">+ Estado de cuenta</button>
      <button class="btn sm ghost" onclick="formTarjeta('${t.id}')">Editar</button></h2>
    <div class="grid g4">
      ${kpi('Debes hoy', money(saldo), '', saldo>0?'bad':'ok')}
      ${kpi('Total abonado', money(abonado), `${movs.filter(esPago).length} abonos`, 'ok')}
      ${kpi('Te ha costado', money(costo), 'intereses + IVA + comisiones', costo>0?'bad':'')}
      ${kpi('Estados de cuenta', String(cortes.length), cortes.length?`último ${fechaCorta(cortes[0].fechaCorte)}`:'ninguno cargado')}
    </div>
    <div class="grid g4" style="margin-top:14px">
      ${kpi('Límite', t.limite?money(t.limite):'—')}
      ${kpi('Tasa anual', t.tasaAnual?num(t.tasaAnual)+'%':'—', t.tasaAnual?`${(num(t.tasaAnual)/12).toFixed(2)}% al mes + IVA`:'')}
      ${kpi('Día de corte', t.diaCorte?String(t.diaCorte):'—', f?`próximo ${fechaCorta(f.corte)}`:'')}
      ${kpi('Días para pagar', t.diasParaPagar?String(t.diasParaPagar):'—', f?`próximo pago ${fechaCorta(f.pago)}`:'')}
    </div>
    ${abonado > 0 && costo > 0 ? `<div style="margin-top:16px">
      <div class="sub" style="margin-bottom:7px">De todo lo que has abonado a esta tarjeta:</div>
      <div class="split">
        <i style="width:${Math.min(100,costo/abonado*100).toFixed(1)}%;background:var(--bad)">${costo/abonado>.12?pct(Math.min(1,costo/abonado)):''}</i>
        <i style="width:${Math.max(0,(1-costo/abonado)*100).toFixed(1)}%;background:var(--ok)">${1-costo/abonado>.12?pct(1-costo/abonado):''}</i>
      </div>
      <div class="leg"><span>🔴 Se fue al banco: <b>${money(costo)}</b></span>
        <span>🟢 Bajó tu deuda: <b>${money(Math.max(0,abonado-costo))}</b></span></div>
    </div>` : ''}
    ${t.nota ? `<p class="sub" style="margin:14px 0 0">${esc(t.nota)}</p>` : ''}
  </div>`;
}

function formTarjeta(id){
  const t = id ? tarjeta(id) : {};
  const color = t.color || COLORES[D.tarjetas.length % COLORES.length];
  modal(id ? 'Editar tarjeta' : 'Nueva tarjeta', `
    <div class="fgrid">
      <div class="field"><label>Nombre de la tarjeta *</label>
        <input name="nombre" value="${esc(t.nombre||'')}" placeholder="Ej. BBVA Azul"></div>
      <div class="field"><label>Banco</label>
        <input name="banco" value="${esc(t.banco||'')}" placeholder="Ej. BBVA"></div>
    </div>
    <div class="fgrid">
      <div class="field"><label>Últimos 4 dígitos</label>
        <input name="ultimos4" value="${esc(t.ultimos4||'')}" maxlength="4" inputmode="numeric" placeholder="1234"></div>
      <div class="field"><label>Límite de crédito</label>
        <input name="limite" value="${t.limite||''}" inputmode="decimal" placeholder="30000"></div>
      <div class="field"><label>Tasa de interés anual %</label>
        <input name="tasaAnual" value="${t.tasaAnual||''}" inputmode="decimal" placeholder="60"></div>
    </div>
    <div class="fgrid">
      <div class="field"><label>Día de corte (1-31)</label>
        <input name="diaCorte" value="${t.diaCorte||''}" inputmode="numeric" placeholder="15"></div>
      <div class="field"><label>Días para pagar tras el corte</label>
        <input name="diasParaPagar" value="${t.diasParaPagar||20}" inputmode="numeric" placeholder="20"></div>
      <div class="field"><label>Anualidad</label>
        <input name="anualidad" value="${t.anualidad||''}" inputmode="decimal" placeholder="0"></div>
    </div>
    <div class="field"><label>Color</label>
      <div style="display:flex;gap:7px;flex-wrap:wrap" id="colores">
        ${COLORES.map(c => `<button type="button" data-c="${c}" style="width:34px;height:34px;border-radius:8px;
          background:${c};border:3px solid ${c===color?'var(--acc)':'transparent'};cursor:pointer"></button>`).join('')}
      </div><input type="hidden" name="color" value="${color}"></div>
    <div class="field"><label>Notas</label>
      <textarea name="nota" placeholder="Promociones, meses sin intereses vigentes, lo que quieras recordar...">${esc(t.nota||'')}</textarea></div>
    <p class="sub" style="margin:0">La tasa anual y el día de corte se usan para estimar intereses y avisarte
    antes de que venza el pago. Vienen impresos en tu estado de cuenta.</p>
  `, [
    ...(id ? [{texto:'Eliminar', clase:'danger', accion:()=>{cerrarModal(); borrarTarjeta(id);}}] : []),
    {espacio:true},
    {texto:'Cancelar', accion:cerrarModal},
    {texto:'Guardar', clase:'', accion:()=>{
      const v = leerForm();
      if(!v.nombre) return aviso('Ponle un nombre a la tarjeta');
      const obj = {nombre:v.nombre, banco:v.banco, ultimos4:v.ultimos4, color:v.color,
        limite:num(v.limite), tasaAnual:num(v.tasaAnual), diaCorte:num(v.diaCorte),
        diasParaPagar:num(v.diasParaPagar)||20, anualidad:num(v.anualidad), nota:v.nota};
      if(id) Object.assign(tarjeta(id), obj);
      else D.tarjetas.push(Object.assign({id:uid(), creado:hoyISO()}, obj));
      cerrarModal(); refrescar(); aviso(id?'Tarjeta actualizada':'Tarjeta agregada ✓');
    }},
  ]);
  $('colores').addEventListener('click', e => {
    const b = e.target.closest('button[data-c]'); if(!b) return;
    $('mBody').querySelector('[name=color]').value = b.dataset.c;
    [...$('colores').children].forEach(x => x.style.borderColor = x === b ? 'var(--acc)' : 'transparent');
  });
}
function borrarTarjeta(id){
  const t = tarjeta(id);
  const nm = movsDe(id).length, np = periodosDe(id).length;
  confirmar('Eliminar tarjeta',
    `Vas a eliminar <b>${esc(t.nombre)}</b> junto con <b>${nm} movimiento(s)</b> y
     <b>${np} estado(s) de cuenta</b>. Esto no se puede deshacer.`,
    () => {
      D.tarjetas = D.tarjetas.filter(x => x.id !== id);
      D.movimientos = D.movimientos.filter(x => x.tarjetaId !== id);
      D.periodos = D.periodos.filter(x => x.tarjetaId !== id);
      refrescar(); aviso('Tarjeta eliminada');
    });
}
</script>

<script>
/* ==========================================================================
   VISTA: Movimientos
   ========================================================================== */
let filtros = {tarjeta:'', tipo:'', mes:'', cat:'', texto:''};

function filaMov(m, conCategoria){
  const t = TIPOS[m.tipo] || TIPOS.compra;
  const signo = t.suma > 0 ? '+' : '−';
  /* Sólo las compras se categorizan: un interés o un abono no son "gasto en algo". */
  const editable = conCategoria && ['compra','disposicion'].includes(m.tipo);
  return `<tr>
    <td style="white-space:nowrap">${fechaCorta(m.fecha)}</td>
    <td>${esc(m.descripcion||'(sin concepto)')}
      ${m.msi ? `<span class="tag azul">${esc(m.msi)} MSI</span>` : ''}
      ${m.nota ? `<span class="nota" tabindex="0" data-tip="${esc(m.nota)}"
        aria-label="Nota: ${esc(m.nota)}">ⓘ</span>` : ''}
      ${!conCategoria && m.categoria ? `<div class="sub">${esc(m.categoria)}</div>` : ''}</td>
    ${conCategoria ? `<td>${editable ? selectorCategoria(m)
        : `<span class="sub">—</span>`}</td>` : ''}
    <td><span class="dot" style="background:${colTarjeta(m.tarjetaId)}"></span>${esc(nomTarjeta(m.tarjetaId))}</td>
    <td><span class="tag ${t.clase}">${t.etiqueta}</span></td>
    <td class="num ${t.suma>0?'neg':'pos'}">${signo} ${money(m.monto)}</td>
    <td style="width:1%;white-space:nowrap">
      <button class="ico" onclick="formMovimiento('${m.id}')" title="Editar">✎</button>
      <button class="ico" onclick="borrarMov('${m.id}')" title="Eliminar">🗑</button></td>
  </tr>`;
}
function vMovs(){
  if(!D.tarjetas.length)
    return `<div class="card">${vacioMsg('Primero agrega una tarjeta.',
      '<button class="btn" onclick="formTarjeta()">+ Agregar tarjeta</button>')}</div>`;

  const meses = [...new Set(D.movimientos.map(m => (m.fecha||'').slice(0,7)).filter(Boolean))].sort().reverse();
  let lista = D.movimientos.filter(m =>
    (!filtros.tarjeta || m.tarjetaId === filtros.tarjeta) &&
    (!filtros.tipo    || m.tipo === filtros.tipo) &&
    (!filtros.mes     || (m.fecha||'').startsWith(filtros.mes)) &&
    (!filtros.cat     || (filtros.cat === '__sin'
                          ? !m.categoria && ['compra','disposicion'].includes(m.tipo)
                          : m.categoria === filtros.cat)) &&
    (!filtros.texto   || (m.descripcion||'').toLowerCase().includes(filtros.texto.toLowerCase())));
  lista = ordenados(lista);

  const suma = arr => arr.reduce((s,m)=>s+Math.abs(num(m.monto)),0);
  const cargos = suma(lista.filter(m => (TIPOS[m.tipo]||{}).suma === +1));
  /* Separar el dinero tuyo de lo que sólo baja el saldo: un cashback y un
     diferimiento a meses reducen la deuda pero no salieron de tu bolsa, y
     sumarlos bajo la palabra "abonos" hace creer que pagaste de más. */
  const pagos   = suma(lista.filter(esPago));
  const ajustes = suma(lista.filter(m => bajaSaldo(m) && !esPago(m)));
  const abonos  = pagos + ajustes;
  /* Un diferimiento no reduce lo que debes: mueve deuda del saldo exigible al
     saldo a meses. Decir "tu deuda bajó" cuando sólo cambió de bolsillo sería
     exactamente el tipo de espejismo que esta herramienta debe romper. */
  const diferido = suma(lista.filter(m => m.tipo === 'diferimiento'));

  /* Gasto por categoría de lo filtrado (sólo compras y disposiciones). */
  const porCat = {};
  lista.filter(m => ['compra','disposicion'].includes(m.tipo))
    .forEach(m => { const c = m.categoria || 'Sin categoría';
      porCat[c] = (porCat[c]||0) + Math.abs(num(m.monto)); });
  const cats = Object.entries(porCat).sort((a,b) => b[1]-a[1]);
  const maxCat = cats.length ? cats[0][1] : 1;

  return `<div class="card">
    <h2>Movimientos <span class="sub">${lista.length} de ${D.movimientos.length}</span><span class="sp"></span>
      <button class="btn sm" onclick="formMovimiento()">+ Movimiento</button>
      <button class="btn sm ghost" onclick="ir('datos')">Cargar estado de cuenta</button></h2>
    ${(()=>{ const p = pendientes();
      return p.movs ? `<div class="aviso ambar">🟡 Te faltan <b>${p.movs} movimientos</b> por
        clasificar (<b>${money(p.monto)}</b>), pero son sólo <b>${p.conceptos.length} conceptos
        distintos</b>. <button class="btn sm" style="margin-left:6px"
        onclick="ir('gastos')">Clasificarlos de golpe</button></div>` : ''; })()}
    <div class="filtros">
      <div class="field"><label>Tarjeta</label><select onchange="filtros.tarjeta=this.value;render()">
        ${selTarjetas(filtros.tarjeta, 'Todas')}</select></div>
      <div class="field"><label>Tipo</label><select onchange="filtros.tipo=this.value;render()">
        ${opciones(Object.entries(TIPOS).map(([k,v])=>({v:k,t:v.etiqueta})), filtros.tipo, 'Todos')}</select></div>
      <div class="field"><label>Mes</label><select onchange="filtros.mes=this.value;render()">
        ${opciones(meses.map(m=>({v:m,t:mesLargo(m)})), filtros.mes, 'Todos')}</select></div>
      <div class="field"><label>Categoría</label><select onchange="filtros.cat=this.value;render()">
        ${opciones([{v:'__sin', t:'⚠ Sin categoría'}, ...CATEGORIAS()], filtros.cat, 'Todas')}</select></div>
      <div class="field" style="flex:1;min-width:170px"><label>Buscar concepto</label>
        <input value="${esc(filtros.texto)}" placeholder="Ej. Oxxo" oninput="filtros.texto=this.value;clearTimeout(window._b);window._b=setTimeout(render,320)"></div>
      ${Object.values(filtros).some(Boolean) ? `<button class="btn sm ghost" onclick="filtros={tarjeta:'',tipo:'',mes:'',cat:'',texto:''};render()">Limpiar</button>` : ''}
    </div>
    <div class="grid ${ajustes>0?'g4':'g3'}" style="margin-bottom:14px">
      ${kpi('Cargos', money(cargos), 'lo que subió tu deuda', cargos>0?'bad':'')}
      ${kpi('Pagaste tú', money(pagos), `${lista.filter(esPago).length} abonos de tu bolsa`, 'ok')}
      ${ajustes>0 ? kpi('Ajustes del banco', money(ajustes),
        'cashback y saldo diferido: bajan la deuda pero no son dinero tuyo') : ''}
      ${kpi('Neto', money(Math.abs(cargos-abonos)),
        diferido > 0 ? 'cambio en el saldo exigible' : (cargos-abonos>0?'tu deuda creció':'tu deuda bajó'),
        cargos-abonos>0 || diferido>0 ? 'bad' : 'ok')}
    </div>
    ${ajustes>0 ? `<div class="aviso azul">ℹ️ De los <b>${money(abonos)}</b> que bajaron el saldo,
      sólo <b>${money(pagos)}</b> salieron de tu bolsa. Los otros <b>${money(ajustes)}</b> son
      cashback que te bonificó el banco${diferido>0?` y <b>${money(diferido)}</b> de saldo que se
      pasó a meses`:''}.</div>` : ''}
    ${diferido>0 ? `<div class="aviso ambar">🟡 <b>Ojo con el "Neto".</b> Diferir a meses no baja lo
      que debes: mueve <b>${money(diferido)}</b> del saldo que te exigen este corte al saldo a meses,
      y lo sigues debiendo con intereses. El neto de arriba mide el saldo exigible, no tu deuda total
      — ésa la ves en <b>Tarjetas</b>.</div>` : ''}
    ${lista.length ? `<div class="tw"><table>
      <thead><tr><th>Fecha</th><th>Concepto</th><th>Categoría</th><th>Tarjeta</th><th>Tipo</th>
        <th class="num">Monto</th><th></th></tr></thead>
      <tbody>${lista.map(m => filaMov(m, true)).join('')}</tbody></table></div>`
      : vacioMsg('No hay movimientos con esos filtros.')}
  </div>
  ${cats.length ? `<div class="card"><h2>En qué se te fue el dinero <span class="sub">según los filtros de arriba</span></h2>
    ${cats.map(([c,v]) => `<div style="margin-bottom:11px">
      <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px">
        <span>${esc(c)}</span><b class="num">${money(v)}</b></div>
      <div class="mini"><i style="width:${(v/maxCat*100).toFixed(1)}%;background:var(--acc)"></i></div>
    </div>`).join('')}
  </div>` : ''}`;
}

function formMovimiento(id, tarjetaPre){
  const m = id ? D.movimientos.find(x => x.id === id) : {};
  modal(id ? 'Editar movimiento' : 'Nuevo movimiento', `
    <div class="fgrid">
      <div class="field"><label>Tarjeta *</label><select name="tarjetaId">
        ${selTarjetas(m.tarjetaId || tarjetaPre || (D.tarjetas[0]||{}).id)}</select></div>
      <div class="field"><label>Fecha *</label>
        <input type="date" name="fecha" value="${m.fecha || hoyISO()}"></div>
    </div>
    <div class="field"><label>Concepto *</label>
      <input name="descripcion" value="${esc(m.descripcion||'')}" placeholder="Ej. Walmart, pago desde nómina, intereses del periodo"></div>
    <div class="fgrid">
      <div class="field"><label>Tipo *</label><select name="tipo">
        ${opciones(Object.entries(TIPOS).map(([k,v])=>({v:k,t:v.etiqueta})), m.tipo||'compra')}</select></div>
      <div class="field"><label>Monto *</label>
        <input name="monto" value="${m.monto||''}" inputmode="decimal" placeholder="0.00"></div>
    </div>
    <div class="fgrid">
      <div class="field"><label>Categoría</label><select name="categoria">
        ${opciones(CATEGORIAS(), m.categoria||'', 'Sin categoría')}</select></div>
      <div class="field"><label>Meses sin intereses</label>
        <input name="msi" value="${esc(m.msi||'')}" placeholder="Ej. 3 de 12"></div>
    </div>
    <div class="field"><label>Nota</label><input name="nota" value="${esc(m.nota||'')}" placeholder="Opcional"></div>
    <p class="sub" style="margin:0">Captura el monto siempre en positivo. El tipo decide si suma o resta a tu deuda:
    <b>Abono/Pago</b> y <b>Bonificación</b> la bajan, todo lo demás la sube.</p>
  `, [
    ...(id ? [{texto:'Eliminar', clase:'danger', accion:()=>{cerrarModal(); borrarMov(id);}}] : []),
    {espacio:true},
    {texto:'Cancelar', accion:cerrarModal},
    {texto:'Guardar', clase:'', accion:()=>{
      const v = leerForm();
      if(!v.tarjetaId) return aviso('Elige la tarjeta');
      if(!num(v.monto)) return aviso('Captura el monto');
      const obj = {tarjetaId:v.tarjetaId, fecha:v.fecha||hoyISO(), descripcion:v.descripcion,
        tipo:v.tipo, monto:Math.abs(num(v.monto)), categoria:v.categoria, msi:v.msi, nota:v.nota};
      if(id) Object.assign(D.movimientos.find(x=>x.id===id), obj);
      else D.movimientos.push(Object.assign({id:uid(), creado:new Date().toISOString()}, obj));
      cerrarModal(); refrescar(); aviso(id?'Movimiento actualizado':'Movimiento agregado ✓');
    }},
  ]);
}
/* ==========================================================================
   Registrar un pago con un botón
   La app no guarda un "ya pagué" aparte: registra el abono real. Así el estado
   del corte (si libró intereses, si sólo cubrió el mínimo) se sigue calculando
   de los movimientos y no de una casilla que puede mentir.
   ========================================================================== */
function formPago(tarjetaId, periodoId){
  const t = tarjeta(tarjetaId);
  if(!t) return aviso('Elige una tarjeta');
  const p = periodoId ? D.periodos.find(x => x.id === periodoId) : periodosDe(tarjetaId)[0];
  const e = p ? estadoPago(p) : null;

  /* Opciones que salen del estado de cuenta, para no teclear cifras. */
  const ops = [];
  const conMeses = p ? num(p.pagoMinimoConMeses) : 0;
  const minBase  = p ? num(p.pagoMinimo) : 0;
  const hayMeses = conMeses > minBase + 0.01;
  if(hayMeses)
    ops.push({m:conMeses, t:'Pago mínimo + mensualidad a meses', d:'Pago mínimo + mensualidad',
              n:'Este es el mínimo de verdad: incluye la mensualidad de tus compras a meses'});
  if(minBase > 0)
    ops.push({m:minBase, t:hayMeses ? 'Pago mínimo a secas ⚠️' : 'Pago mínimo', d:'Pago mínimo',
              n: hayMeses
                 ? 'No cubre la mensualidad a meses: tus compras diferidas empezarían a generar intereses'
                 : 'Mantiene la tarjeta al corriente, pero genera intereses',
              malo: hayMeses});
  if(e && e.faltante > 0.5 && Math.abs(e.faltante - num(p.pagoMinimo)) > 0.5)
    ops.push({m:+e.faltante.toFixed(2), t:'Lo que falta para no generar intereses',
              d:'Pago para no generar intereses',
              n:'Con esto este corte no te cobra un peso de intereses'});
  else if(p && num(p.pagoNoIntereses||p.saldoNuevo) > 0 && !(e && e.faltante > 0.5))
    ops.push({m:num(p.pagoNoIntereses||p.saldoNuevo), t:'Pago para no generar intereses',
              d:'Pago para no generar intereses', n:'Liquida el saldo del corte'});

  /* De menor a mayor: así se lee como una escalera y se ve de un golpe cuál
     opción conviene. A veces liquidar el corte cuesta menos que el "mínimo +
     mensualidad", y eso hay que poder verlo. */
  ops.sort((a,b) => a.m - b.m);
  /* Se listan de menor a mayor porque así se leen, pero la que viene marcada es
     la más barata que NO te perjudica: nunca hay que preseleccionar la opción
     que le quita los meses sin intereses a sus compras diferidas. */
  const iSugerida = Math.max(0, ops.findIndex(o => o.m && !o.malo));
  const liquidar = ops.find(o => o.d === 'Pago para no generar intereses');
  const conMensualidad = ops.find(o => o.d === 'Pago mínimo + mensualidad');
  const liquidarSaleMejor = liquidar && conMensualidad && liquidar.m < conMensualidad.m;

  const hoy = hoyISO();
  const tarde = p && hoy > (p.fechaLimitePago||'');

  modal(`Registrar pago · ${t.nombre}`, `
    ${p ? `<div class="aviso ${e.clave==='total'?'verde':tarde?'rojo':'azul'}" style="margin-bottom:16px">
      Corte del <b>${fechaCorta(p.fechaCorte)}</b>, vence el <b>${fechaCorta(p.fechaLimitePago)}</b>.
      Saldo del corte <b>${money(p.saldoNuevo)}</b>${e.pagado>0?` · ya abonaste <b>${money(e.pagado)}</b>`:''}.
      ${tarde ? '<br>⚠️ La fecha límite ya pasó: este pago va a contar como tardío y el corte igual generó intereses.' : ''}
    </div>
    ${hayMeses ? `<div class="aviso ambar" style="margin:-6px 0 16px">🟡 Traes
      <b>${money(p.saldoDiferido)}</b> en compras a meses. El estado de cuenta pide
      <b>${money(conMeses)}</b>, no ${money(minBase)}: la diferencia es la mensualidad de esas compras.
      Si pagas sólo ${money(minBase)}, el contrato dice que tus compras diferidas
      <b>empiezan a generar intereses ordinarios</b> el siguiente periodo.</div>` : ''}
    ${liquidarSaleMejor ? `<div class="aviso verde" style="margin:-6px 0 16px">💡 Aquí liquidar
      sale <b>más barato</b> que el mínimo con mensualidad: con <b>${money(liquidar.m)}</b> dejas
      el corte en ceros, contra ${money(conMensualidad.m)} del mínimo con mensualidad.</div>` : ''}` : `<div class="aviso ambar" style="margin-bottom:16px">Esta tarjeta no tiene estados de
      cuenta cargados, así que no puedo sugerirte montos. Captura el pago a mano.</div>`}

    ${ops.length ? `<label>¿Cuánto pagaste?</label>
      <div class="ops" id="opsPago">
        ${ops.map(o => `<button type="button" class="opcion${o.malo?' malo':''}"
            data-monto="${o.m.toFixed(2)}" data-desc="${esc(o.d)}">
          <b>${money(o.m)}</b><span>${esc(o.t)}</span><em>${esc(o.n)}</em></button>`).join('')}
        <button type="button" class="opcion" data-monto="" data-desc="Pago">
          <b>Otro monto</b><span>Lo capturas abajo</span></button>
      </div>` : ''}

    <div class="fgrid" style="margin-top:14px">
      <div class="field"><label>Monto pagado *</label>
        <input name="monto" id="montoPago" inputmode="decimal" placeholder="0.00"
          value="${ops.length && ops[iSugerida].m ? ops[iSugerida].m.toFixed(2) : ''}"></div>
      <div class="field"><label>Fecha del pago *</label>
        <input type="date" name="fecha" value="${hoy}"></div>
    </div>
    <div class="field"><label>Concepto</label>
      <input name="descripcion" id="descPago" value="${ops.length ? esc(ops[iSugerida].d) : 'Pago'}"></div>
    <input type="hidden" name="tarjetaId" value="${tarjetaId}">
    <p class="sub" style="margin:0">Confirma sólo pagos que ya hiciste. Esto registra un abono real:
    si lo apuntas y no lo hiciste, el saldo que te muestre la app va a ser mentira.</p>
  `, [
    {texto:'Cancelar', accion:cerrarModal},
    {texto:'Registrar pago', clase:'', accion:()=>{
      const v = leerForm();
      const monto = Math.abs(num(v.monto));
      if(!monto) return aviso('Captura cuánto pagaste');
      D.movimientos.push({id:uid(), tarjetaId:v.tarjetaId, fecha:v.fecha||hoyISO(),
        descripcion:v.descripcion||'Pago', tipo:'abono', monto, categoria:'', msi:'', nota:'',
        corte:'', creado:new Date().toISOString()});
      guardar();
      cerrarModal();
      resultadoPago(v.tarjetaId, p ? p.id : null, monto);
    }},
  ]);

  const cont = $('opsPago');
  if(cont) cont.addEventListener('click', ev => {
    const b = ev.target.closest('button[data-monto]'); if(!b) return;
    [...cont.children].forEach(x => x.classList.toggle('on', x === b));
    $('montoPago').value = b.dataset.monto;
    $('descPago').value = b.dataset.desc;
    if(!b.dataset.monto) $('montoPago').focus();
  });
  if(cont && cont.children[iSugerida]) cont.children[iSugerida].classList.add('on');
}

/* Después de registrar, decir qué logró ese pago: es la razón de ser de la app. */
function resultadoPago(tarjetaId, periodoId, monto){
  render();
  const p = periodoId ? D.periodos.find(x => x.id === periodoId) : null;
  if(!p) return aviso(`Pago de ${money(monto)} registrado ✓`, 3200);
  const e = estadoPago(p);
  const t = tarjeta(tarjetaId) || {};
  const cuerpo =
    e.clave === 'total'
      ? `<div class="aviso verde" style="margin:0">✅ <b>Liquidaste el corte.</b> Este periodo no te
         va a cobrar un peso de intereses. Así es como no crece la deuda.
         ${e.excedente > 0 ? `<br><br>Además pagaste <b>${money(e.excedente)}</b> de más: ese
           excedente se va a restar del corte siguiente, no se pierde.` : ''}</div>`
    : e.clave === 'minimo'
      ? `<div class="aviso ambar" style="margin:0">🟡 <b>Cubriste el mínimo, pero no liquidaste.</b>
         Te faltan <b>${money(e.faltante)}</b> de ${money(e.noInt)}. Sobre lo que quedó, el próximo
         corte te va a cobrar${t.tasaAnual?` alrededor de <b>${money(interesEstimado(t, num(p.saldoNuevo)-e.pagado))}</b>`:' intereses'}.
         Pagar el mínimo mantiene la tarjeta al corriente; no baja la deuda.</div>`
    : e.clave === 'sinMensualidad'
      ? `<div class="aviso rojo" style="margin:0">🔴 <b>Cubriste el pago mínimo, pero no la
         mensualidad de tus compras a meses.</b> El estado de cuenta pedía <b>${money(e.min)}</b> y
         abonaste ${money(e.pagado)}. Con esto tus compras diferidas empiezan a generar intereses
         ordinarios el siguiente periodo. Te faltan <b>${money(e.min - e.pagado)}</b> para evitarlo.</div>`
    : e.clave === 'tardio'
      ? `<div class="aviso rojo" style="margin:0">🔴 <b>El pago llegó después de la fecha límite.</b>
         Bajó tu saldo, pero este corte ya generó intereses y puede traer comisión por pago tardío.</div>`
      : `<div class="aviso rojo" style="margin:0">🔴 <b>No alcanzó ni para el pago mínimo</b>
         (${money(e.min)}). Además de intereses puede haber comisión por pago tardío.</div>`;
  modal('Pago registrado', `
    <p style="margin:0 0 14px;line-height:1.6">Registré <b>${money(monto)}</b> a
      <b>${esc(t.nombre||'')}</b>.</p>
    ${cuerpo}
    <div class="grid g3" style="margin-top:16px">
      ${kpi('Abonado a este corte', money(e.total))}
      ${kpi('Saldo del corte', money(p.saldoNuevo))}
      ${kpi('Falta para liquidar', money(e.faltante), '', e.faltante>0?'bad':'ok')}
    </div>
  `, [{espacio:true}, {texto:'Entendido', clase:'', accion:cerrarModal}]);
}

function borrarMov(id){
  const m = D.movimientos.find(x => x.id === id);
  confirmar('Eliminar movimiento',
    `¿Eliminar <b>${esc(m.descripcion||'este movimiento')}</b> por <b>${money(m.monto)}</b>?`,
    () => { D.movimientos = D.movimientos.filter(x => x.id !== id); refrescar(); aviso('Movimiento eliminado'); });
}
</script>

<script>
/* ==========================================================================
   VISTA: Estados de cuenta (cortes)
   Aquí se compara lo que dice el banco contra los movimientos capturados.
   ========================================================================== */
function vCortes(){
  if(!D.tarjetas.length)
    return `<div class="card">${vacioMsg('Primero agrega una tarjeta.',
      '<button class="btn" onclick="formTarjeta()">+ Agregar tarjeta</button>')}</div>`;

  const cargados = [...D.periodos].sort((a,b) => (b.fechaCorte||'').localeCompare(a.fechaCorte||''));
  const todos = cargados.filter(p => !fCortes.tarjeta || p.tarjetaId === fCortes.tarjeta);
  if(!cargados.length)
    return `<div class="card"><h2>Estados de cuenta</h2>
      ${vacioMsg(`Aquí capturas los datos que vienen impresos en cada estado de cuenta: saldo anterior,
        saldo nuevo, pago mínimo, pago para no generar intereses y las fechas de corte y límite de pago.<br><br>
        Con eso puedo <b>conciliar</b>: revisar si el saldo que te cobran cuadra con los movimientos
        que tienes capturados. Cuando no cuadra, ahí está el cobro que no reconoces.`,
        '<button class="btn" onclick="formPeriodo()">+ Cargar estado de cuenta</button>')}</div>`;

  /* Con una sola tarjeta el filtro sólo estorba. */
  const filtrable = D.tarjetas.length > 1;
  const t = fCortes.tarjeta ? tarjeta(fCortes.tarjeta) : null;

  return `<div class="card"><h2>Estados de cuenta
    <span class="sub">${fCortes.tarjeta ? `${todos.length} de ${cargados.length}` : `${cargados.length} cargados`}</span>
    <span class="sp"></span>
    ${filtrable ? `<select style="width:auto" onchange="fCortes.tarjeta=this.value;render()">
      ${selTarjetas(fCortes.tarjeta, 'Todas las tarjetas')}</select>` : ''}
    <button class="btn sm" onclick="formPeriodo()">+ Cargar estado de cuenta</button></h2>

    ${t ? (()=>{ /* Resumen de la tarjeta filtrada: lo que se busca al aislarla. */
      const dif = todos.filter(p => !conciliar(p).cuadra && conciliar(p).movs.length).length;
      const costo = movsDe(t.id).filter(m => TIPOS_COSTO.includes(m.tipo))
        .reduce((s,m)=>s+Math.abs(num(m.monto)),0);
      const sinLiquidar = todos.filter(p => estadoPago(p).clave !== 'total').length;
      return `<div class="grid g4" style="margin-bottom:16px">
        ${kpi('Debes hoy', money(saldoTarjeta(t.id)),
          num((periodosDe(t.id)[0]||{}).saldoDiferido) > 0
            ? `exigible ${money(saldoExigible(t.id))} · a meses ${money((periodosDe(t.id)[0]||{}).saldoDiferido)}` : '',
          saldoTarjeta(t.id)>0?'bad':'ok')}
        ${kpi('Intereses y cargos', money(costo), `en ${todos.length} corte(s)`, costo>0?'bad':'ok')}
        ${kpi('Cortes sin liquidar', String(sinLiquidar),
          sinLiquidar ? 'cada uno generó intereses' : 'todos pagados completos', sinLiquidar?'warn':'ok')}
        ${kpi('Cortes que no cuadran', String(dif),
          dif ? 'revísalos con la lupa' : 'todo conciliado', dif?'bad':'ok')}
      </div>`; })() : ''}

    ${!todos.length ? vacioMsg('Esa tarjeta no tiene estados de cuenta cargados.',
        `<button class="btn" onclick="formPeriodo(null,'${fCortes.tarjeta}')">+ Cargar uno</button>`) : `
    <div class="tw"><table>
      <thead><tr>${fCortes.tarjeta ? '' : '<th>Tarjeta</th>'}<th>Corte</th><th>Vence</th><th class="num">Saldo del corte</th>
        <th class="num">Pago mínimo</th><th class="num">Abonado</th><th>Estado</th><th>Cuadra</th><th></th></tr></thead>
      <tbody>${todos.map(p => {
        const e = estadoPago(p), c = conciliar(p);
        return `<tr>
          ${fCortes.tarjeta ? '' : `<td><span class="dot" style="background:${colTarjeta(p.tarjetaId)}"></span>${esc(nomTarjeta(p.tarjetaId))}</td>`}
          <td>${fechaCorta(p.fechaCorte)}</td>
          <td>${fechaCorta(p.fechaLimitePago)}</td>
          <td class="num">${money(p.saldoNuevo)}</td>
          <td class="num">${money(minimoEfectivo(p))}
            ${e.hayMeses ? `<div class="sub">incluye ${money(minimoEfectivo(p)-e.minBase)} de mensualidad</div>` : ''}</td>
          <td class="num ${e.pagado>0?'pos':''}">${money(e.pagado)}
            ${e.tardio>0?`<div class="sub">+${money(e.tardio)} tarde</div>`:''}
            ${e.excedente>0?`<div class="sub">${money(e.excedente)} de más → al corte siguiente</div>`:''}</td>
          <td><span class="tag ${e.clase}">${e.etiqueta}</span></td>
          <td>${c.movs.length === 0 ? '<span class="tag gris">sin movs</span>'
              : c.cuadra ? '<span class="tag verde">✓ cuadra</span>'
              : `<span class="tag rojo">${c.dif>0?'+':''}${money(c.dif)}</span>`}</td>
          <td style="width:1%;white-space:nowrap">
            <button class="ico" onclick="formPago('${p.tarjetaId}','${p.id}')" title="Registrar pago">💵</button>
            <button class="ico" onclick="detallePeriodo('${p.id}')" title="Ver detalle">🔍</button>
            <button class="ico" onclick="formPeriodo('${p.id}')" title="Editar">✎</button>
            <button class="ico" onclick="borrarPeriodo('${p.id}')" title="Eliminar">🗑</button></td>
        </tr>`;}).join('')}</tbody></table></div>`}
    <p class="sub" style="margin:12px 0 0">La columna <b>Cuadra</b> compara
    <code>saldo anterior + cargos − abonos</code> contra el saldo que te reporta el banco.
    Si marca una diferencia, o falta capturar un movimiento o hay un cobro que no viene desglosado.</p>
  </div>`;
}

function detallePeriodo(id){
  const p = D.periodos.find(x => x.id === id);
  const t = tarjeta(p.tarjetaId) || {};
  const c = conciliar(p), e = estadoPago(p);
  const abonos = abonosDelPeriodo(p);

  const desglose = {};
  c.movs.forEach(m => { desglose[m.tipo] = (desglose[m.tipo]||0) + Math.abs(num(m.monto)); });

  modal(`Corte del ${fechaCorta(p.fechaCorte)} · ${t.nombre||''}`, `
    <div class="grid g3" style="margin-bottom:14px">
      ${kpi('Saldo anterior', money(p.saldoAnterior))}
      ${kpi('Saldo del corte', money(p.saldoNuevo))}
      ${kpi('Abonado a este corte', money(e.total),
        e.total>0 ? `${abonos.length} abono(s)` + (e.tardio>0?` · ${money(e.tardio)} fuera de fecha`:' a tiempo')
                  : 'ninguno', e.total>0?'ok':'')}
    </div>
    <div class="grid g3" style="margin-bottom:16px">
      ${kpi('Pago mínimo', money(p.pagoMinimo))}
      ${kpi('Pago sin intereses', money(p.pagoNoIntereses||p.saldoNuevo))}
      ${kpi('Vence', fechaCorta(p.fechaLimitePago), e.venceEn===null?'':(e.venceEn<0?`hace ${-e.venceEn} días`:`en ${e.venceEn} días`))}
    </div>

    <div class="aviso ${e.clase}"><b>${e.etiqueta}.</b>
      ${e.clave==='total' ? ' Pagaste completo el saldo del corte: este periodo no te generó intereses. Así se hace.'
      : e.clave==='minimo' ? ` Cubriste el mínimo (${money(e.min)}) pero te faltaron <b>${money(e.faltante)}</b>
          para liquidar. Sobre el saldo que quedó, el banco te va a cobrar intereses${t.tasaAnual?` de aproximadamente
          <b>${money(interesEstimado(t, num(p.saldoNuevo)-e.pagado))}</b>`:''} en el siguiente corte.
          <b>Por esto abonas y no ves que baje.</b>`
      : e.clave==='parcial' ? ` Abonaste ${money(e.pagado)} pero ni siquiera cubriste el pago mínimo de
          ${money(e.min)}. Además de intereses puede haber comisión por pago tardío.`
      : e.clave==='tardio' ? ` Abonaste <b>${money(e.tardio)}</b>, pero después del
          ${fechaCorta(p.fechaLimitePago)}. El dinero sí bajó tu saldo, pero llegó tarde para
          librarte de los intereses de este corte, y puede haber comisión por pago tardío.`
      : ' No hay abonos registrados para este corte.'}</div>
    ${e.tardio > 0 && e.clave !== 'tardio' ? `<div class="aviso ambar">🟡 Además abonaste
      <b>${money(e.tardio)}</b> después de la fecha límite: ese dinero bajó tu saldo pero
      ya no evitó los intereses de este corte.</div>` : ''}

    ${e.excedente > 0 ? (()=>{ const sig = corteSiguiente(p);
      return `<div class="aviso azul">💡 <b>Pagaste ${money(e.excedente)} de más.</b>

        Ese excedente no se pierde ni se lo queda el banco: se resta del corte siguiente.
        ${sig ? `De hecho, el corte del <b>${fechaCorta(sig.fechaCorte)}</b> cerró en
          <b>${money(sig.saldoNuevo)}</b>; sin este excedente habría cerrado en
          <b>${money(num(sig.saldoNuevo) + e.excedente)}</b>.`
              : 'Lo verás cuando cargues el corte siguiente.'}
        <br><br>El estado de cuenta no lo muestra aparte: lo mete dentro del renglón único de
        <i>pagos y abonos</i>, y por eso parece que se esfumó.</div>`; })() : ''}

    ${c.movs.length ? `
      <h3 style="font-size:14px;margin:18px 0 9px">Conciliación</h3>
      <div class="tw"><table>
        <tbody>
          <tr><td>Saldo anterior</td><td class="num">${money(p.saldoAnterior)}</td></tr>
          <tr><td>+ Cargos del periodo (${c.movs.filter(m=>(TIPOS[m.tipo]||{}).suma===1).length})</td>
              <td class="num neg">+ ${money(c.cargos)}</td></tr>
          <tr><td>− Abonos del periodo (${c.movs.filter(m=>(TIPOS[m.tipo]||{}).suma===-1).length})</td>
              <td class="num pos">− ${money(c.abonos)}</td></tr>
          <tr><td><b>= Saldo que debería salir</b></td><td class="num"><b>${money(c.esperado)}</b></td></tr>
          <tr><td><b>Saldo que reporta el banco</b></td><td class="num"><b>${money(p.saldoNuevo)}</b></td></tr>
          <tr><td><b>Diferencia</b></td>
              <td class="num ${c.cuadra?'pos':'neg'}"><b>${c.dif>=0?'+':''}${money(c.dif)}</b></td></tr>
        </tbody></table></div>
      ${c.cuadra
        ? `<div class="aviso verde" style="margin-top:11px">✅ Cuadra. Todo lo que te cobraron está capturado
           y explicado. No hay cobros fantasma en este corte.</div>`
        : `<div class="aviso rojo" style="margin-top:11px">🔴 <b>No cuadra por ${money(Math.abs(c.dif))}.</b>
           ${c.dif > 0
             ? `El banco te cobra ${money(Math.abs(c.dif))} <b>de más</b> respecto a los movimientos capturados.
                Puede ser: intereses o comisiones que no has capturado, una compra a meses que se difiere,
                o un cargo que no reconoces. Revisa el estado de cuenta línea por línea y captura lo que falte;
                si aun así no cuadra, ahí tienes qué aclarar con el banco.`
             : `Tus movimientos capturados suman ${money(Math.abs(c.dif))} <b>más</b> de lo que reporta el banco.
                Probablemente hay un movimiento duplicado, uno que aún no aparece en este corte,
                o un abono que capturaste con fecha anterior a la real.`}</div>`}

      ${Object.keys(desglose).length ? `<h3 style="font-size:14px;margin:18px 0 9px">Qué compone este corte</h3>
        ${Object.entries(desglose).sort((a,b)=>b[1]-a[1]).map(([k,v]) => `
          <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)">
            <span><span class="tag ${TIPOS[k].clase}">${TIPOS[k].etiqueta}</span></span>
            <b class="num">${money(v)}</b></div>`).join('')}` : ''}

      <h3 style="font-size:14px;margin:18px 0 9px">Movimientos del periodo (${c.movs.length})</h3>
      <div class="tw"><table><tbody>${ordenados(c.movs).map(m => `<tr>
        <td style="white-space:nowrap">${fechaCorta(m.fecha)}</td>
        <td>${esc(m.descripcion||'—')}
          ${m.nota ? `<span class="nota" tabindex="0" data-tip="${esc(m.nota)}">ⓘ</span>` : ''}</td>
        <td><span class="tag ${TIPOS[m.tipo].clase}">${TIPOS[m.tipo].etiqueta}</span></td>
        <td class="num ${TIPOS[m.tipo].suma>0?'neg':'pos'}">${TIPOS[m.tipo].suma>0?'+':'−'} ${money(m.monto)}</td>
      </tr>`).join('')}</tbody></table></div>`
    : `<div class="aviso azul">Todavía no hay movimientos capturados dentro de este periodo, así que no puedo
       conciliarlo. Carga el desglose del estado de cuenta para saber en qué se te fue y si el saldo cuadra.</div>`}

    ${abonos.length ? `<h3 style="font-size:14px;margin:18px 0 9px">Abonos aplicados a este corte</h3>
      <div class="tw"><table><tbody>${abonos.map(m => `<tr>
        <td>${fechaCorta(m.fecha)}</td><td>${esc(m.descripcion||'Abono')}</td>
        <td class="num pos">${money(m.monto)}</td></tr>`).join('')}</tbody></table></div>` : ''}
    ${p.nota ? `<p class="sub" style="margin:16px 0 0">${esc(p.nota)}</p>` : ''}
  `, [{texto:'💵 Registrar pago', accion:()=>{cerrarModal(); formPago(p.tarjetaId, p.id);}},
      {texto:'Editar', accion:()=>{cerrarModal(); formPeriodo(id);}},
      {espacio:true},
      {texto:'Cerrar', clase:'', accion:cerrarModal}]);
}

function formPeriodo(id, tarjetaPre){
  const p = id ? D.periodos.find(x => x.id === id) : {};
  const tid = p.tarjetaId || tarjetaPre || (D.tarjetas[0]||{}).id;
  const t = tarjeta(tid) || {};
  /* Sugerimos la fecha límite a partir de los días para pagar de la tarjeta. */
  modal(id ? 'Editar estado de cuenta' : 'Cargar estado de cuenta', `
    <div class="fgrid">
      <div class="field"><label>Tarjeta *</label><select name="tarjetaId">${selTarjetas(tid)}</select></div>
      <div class="field"><label>Fecha de corte *</label>
        <input type="date" name="fechaCorte" id="fCorte" value="${p.fechaCorte||''}"></div>
      <div class="field"><label>Fecha límite de pago *</label>
        <input type="date" name="fechaLimitePago" id="fPago" value="${p.fechaLimitePago||''}"></div>
    </div>
    <div class="fgrid">
      <div class="field"><label>Saldo anterior</label>
        <input name="saldoAnterior" value="${p.saldoAnterior??''}" inputmode="decimal" placeholder="0.00"></div>
      <div class="field"><label>Saldo al corte *</label>
        <input name="saldoNuevo" value="${p.saldoNuevo??''}" inputmode="decimal" placeholder="0.00"></div>
    </div>
    <div class="fgrid">
      <div class="field"><label>Pago mínimo</label>
        <input name="pagoMinimo" value="${p.pagoMinimo??''}" inputmode="decimal" placeholder="0.00"></div>
      <div class="field"><label>Pago para no generar intereses</label>
        <input name="pagoNoIntereses" value="${p.pagoNoIntereses??''}" inputmode="decimal" placeholder="0.00"></div>
      <div class="field"><label>Saldo a meses (no exigible aún)</label>
        <input name="saldoDiferido" value="${p.saldoDiferido??''}" inputmode="decimal" placeholder="0.00"></div>
      <div class="field"><label>Pago mínimo + compras a meses</label>
        <input name="pagoMinimoConMeses" value="${p.pagoMinimoConMeses??''}" inputmode="decimal" placeholder="0.00"></div>
    </div>
    <div class="field"><label>Notas</label>
      <textarea name="nota" placeholder="Ej. cobro de $340 que no reconozco, aclaración folio 12345...">${esc(p.nota||'')}</textarea></div>
    <p class="sub" style="margin:0">Todos estos números vienen en la primera hoja de tu estado de cuenta.
    Captura además los movimientos del periodo (a mano o importando el desglose) para que pueda conciliar.</p>
  `, [
    ...(id ? [{texto:'Eliminar', clase:'danger', accion:()=>{cerrarModal(); borrarPeriodo(id);}}] : []),
    {espacio:true},
    {texto:'Cancelar', accion:cerrarModal},
    {texto:'Guardar', clase:'', accion:()=>{
      const v = leerForm();
      if(!v.tarjetaId) return aviso('Elige la tarjeta');
      if(!v.fechaCorte) return aviso('Captura la fecha de corte');
      const obj = {tarjetaId:v.tarjetaId, fechaCorte:v.fechaCorte,
        fechaLimitePago:v.fechaLimitePago || sumaDias(v.fechaCorte, num(tarjeta(v.tarjetaId)?.diasParaPagar)||20),
        saldoAnterior:num(v.saldoAnterior), saldoNuevo:num(v.saldoNuevo),
        pagoMinimo:num(v.pagoMinimo), pagoNoIntereses:num(v.pagoNoIntereses),
        saldoDiferido:num(v.saldoDiferido),
        pagoMinimoConMeses:num(v.pagoMinimoConMeses), nota:v.nota};
      if(id) Object.assign(D.periodos.find(x=>x.id===id), obj);
      else D.periodos.push(Object.assign({id:uid(), creado:hoyISO()}, obj));
      cerrarModal(); refrescar(); aviso(id?'Estado de cuenta actualizado':'Estado de cuenta cargado ✓');
    }},
  ]);
  /* Al poner la fecha de corte, calculamos sola la fecha límite de pago. */
  $('fCorte').addEventListener('change', function(){
    const pg = $('fPago');
    if(this.value && !pg.value){
      const sel = $('mBody').querySelector('[name=tarjetaId]').value;
      pg.value = sumaDias(this.value, num(tarjeta(sel)?.diasParaPagar) || 20);
    }
  });
}
function borrarPeriodo(id){
  const p = D.periodos.find(x => x.id === id);
  confirmar('Eliminar estado de cuenta',
    `¿Eliminar el corte del <b>${fechaCorta(p.fechaCorte)}</b> de ${esc(nomTarjeta(p.tarjetaId))}?
     Los movimientos capturados no se borran.`,
    () => { D.periodos = D.periodos.filter(x => x.id !== id); refrescar(); aviso('Estado de cuenta eliminado'); });
}
</script>

<script>
/* ==========================================================================
   VISTA: Ingresos
   ========================================================================== */
function vIngresos(){
  const lista = [...D.ingresos].sort((a,b) => (b.fecha||'').localeCompare(a.fecha||''));
  const mes = hoyISO().slice(0,7);
  const delMes = lista.filter(i => (i.fecha||'').startsWith(mes)).reduce((s,i)=>s+num(i.monto),0);

  /* Promedio de los últimos 6 meses con registros. */
  const porMes = {};
  lista.forEach(i => { const k = (i.fecha||'').slice(0,7); if(k) porMes[k] = (porMes[k]||0) + num(i.monto); });
  const claves = Object.keys(porMes).sort().reverse().slice(0,6);
  const prom = claves.length ? claves.reduce((s,k)=>s+porMes[k],0)/claves.length : 0;
  const deuda = D.tarjetas.reduce((s,t) => s + saldoTarjeta(t.id), 0);

  return `<div class="card">
    <h2>Ingresos <span class="sp"></span><button class="btn sm" onclick="formIngreso()">+ Ingreso</button></h2>
    <div class="grid g3" style="margin-bottom:14px">
      ${kpi('Este mes', money(delMes), mesLargo(mes), 'ok')}
      ${kpi('Promedio mensual', money(prom), `últimos ${claves.length} mes(es) con registro`)}
      ${kpi('Tu deuda vs tu ingreso', prom>0 ? (deuda/prom).toFixed(1)+' meses' : '—',
        prom>0 ? 'de ingreso completo para liquidar todo' : 'registra ingresos para calcularlo',
        prom>0 && deuda/prom>3 ? 'bad' : '')}
    </div>
    ${lista.length ? `<div class="tw"><table>
      <thead><tr><th>Fecha</th><th>Concepto</th><th>Fuente</th><th class="num">Monto</th><th></th></tr></thead>
      <tbody>${lista.map(i => `<tr>
        <td style="white-space:nowrap">${fechaCorta(i.fecha)}</td>
        <td>${esc(i.concepto||'—')}${i.nota?`<div class="sub">${esc(i.nota)}</div>`:''}</td>
        <td>${esc(i.fuente||'—')}</td>
        <td class="num pos">${money(i.monto)}</td>
        <td style="width:1%"><button class="ico" onclick="formIngreso('${i.id}')">✎</button>
          <button class="ico" onclick="borrarIngreso('${i.id}')">🗑</button></td></tr>`).join('')}
      </tbody></table></div>`
      : vacioMsg(`Registra lo que entra: sueldo, ventas, comisiones, lo que sea.<br>
        Sirve para saber cuánto de tu ingreso se está yendo a las tarjetas.`,
        '<button class="btn" onclick="formIngreso()">+ Registrar ingreso</button>')}
  </div>
  ${claves.length > 1 ? `<div class="card"><h2>Ingreso por mes</h2>
    ${(()=>{ const max = Math.max(...Object.values(porMes));
      return Object.keys(porMes).sort().reverse().slice(0,12).map(k => `
        <div style="margin-bottom:11px">
          <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px">
            <span>${mesLargo(k)}</span><b class="num">${money(porMes[k])}</b></div>
          <div class="mini"><i style="width:${(porMes[k]/max*100).toFixed(1)}%;background:var(--ok)"></i></div>
        </div>`).join(''); })()}
  </div>` : ''}`;
}
function formIngreso(id){
  const i = id ? D.ingresos.find(x => x.id === id) : {};
  modal(id ? 'Editar ingreso' : 'Nuevo ingreso', `
    <div class="fgrid">
      <div class="field"><label>Fecha *</label><input type="date" name="fecha" value="${i.fecha||hoyISO()}"></div>
      <div class="field"><label>Monto *</label><input name="monto" value="${i.monto||''}" inputmode="decimal" placeholder="0.00"></div>
    </div>
    <div class="field"><label>Concepto *</label>
      <input name="concepto" value="${esc(i.concepto||'')}" placeholder="Ej. Quincena, venta de..."></div>
    <div class="field"><label>Fuente</label>
      <input name="fuente" value="${esc(i.fuente||'')}" placeholder="Ej. Nómina, negocio, freelance"></div>
    <div class="field"><label>Nota</label><input name="nota" value="${esc(i.nota||'')}" placeholder="Opcional"></div>
  `, [
    ...(id ? [{texto:'Eliminar', clase:'danger', accion:()=>{cerrarModal(); borrarIngreso(id);}}] : []),
    {espacio:true},
    {texto:'Cancelar', accion:cerrarModal},
    {texto:'Guardar', clase:'', accion:()=>{
      const v = leerForm();
      if(!num(v.monto)) return aviso('Captura el monto');
      const obj = {fecha:v.fecha||hoyISO(), monto:Math.abs(num(v.monto)),
        concepto:v.concepto, fuente:v.fuente, nota:v.nota};
      if(id) Object.assign(D.ingresos.find(x=>x.id===id), obj);
      else D.ingresos.push(Object.assign({id:uid()}, obj));
      cerrarModal(); refrescar(); aviso('Ingreso guardado ✓');
    }},
  ]);
}
function borrarIngreso(id){
  D.ingresos = D.ingresos.filter(x => x.id !== id);
  refrescar(); aviso('Ingreso eliminado');
}

/* ==========================================================================
   VISTA: ¿Por qué no baja la deuda?
   ========================================================================== */
function vAnalisis(){
  if(!D.movimientos.length)
    return `<div class="card"><h2>¿Por qué no baja mi deuda?</h2>
      ${vacioMsg(`Cuando cargues movimientos y abonos, aquí te desgloso peso por peso
        cuánto de lo que pagas se lo queda el banco en intereses, IVA y comisiones,
        y cuánto realmente baja tu deuda.`)}</div>`;

  const abonado = D.movimientos.filter(esPago).reduce((s,m)=>s+Math.abs(num(m.monto)),0);
  const costo = D.movimientos.filter(m => TIPOS_COSTO.includes(m.tipo))
    .reduce((s,m)=>s+Math.abs(num(m.monto)),0);
  const compras = D.movimientos.filter(m => ['compra','disposicion'].includes(m.tipo))
    .reduce((s,m)=>s+Math.abs(num(m.monto)),0);
  const capital = abonado - costo;
  const porCien = abonado > 0 ? (costo/abonado*100) : 0;

  /* Costo por tipo. */
  const porTipo = {};
  TIPOS_COSTO.forEach(k => {
    const v = D.movimientos.filter(m => m.tipo === k).reduce((s,m)=>s+Math.abs(num(m.monto)),0);
    if(v > 0) porTipo[k] = v;
  });
  /* Costo por tarjeta, ordenado por lo que más te cuesta. */
  const porTarjeta = D.tarjetas.map(t => {
    const ms = movsDe(t.id);
    return {t,
      costo: ms.filter(m => TIPOS_COSTO.includes(m.tipo)).reduce((s,m)=>s+Math.abs(num(m.monto)),0),
      abonado: ms.filter(esPago).reduce((s,m)=>s+Math.abs(num(m.monto)),0),
      saldo: saldoTarjeta(t.id)};
  }).sort((a,b) => b.costo - a.costo);

  /* Costo mes a mes. */
  const porMes = {};
  D.movimientos.filter(m => TIPOS_COSTO.includes(m.tipo)).forEach(m => {
    const k = (m.fecha||'').slice(0,7); if(k) porMes[k] = (porMes[k]||0) + Math.abs(num(m.monto)); });
  const mesesOrd = Object.keys(porMes).sort().reverse().slice(0,12);
  const maxMes = mesesOrd.length ? Math.max(...mesesOrd.map(k=>porMes[k])) : 1;

  /* Cortes que sólo pagaron el mínimo: la causa más común de que no baje. */
  const minimos = D.periodos.map(p => ({p, e: estadoPago(p)}))
    .filter(x => ['minimo','parcial','tardio','vencido'].includes(x.e.clave))
    .sort((a,b) => (b.p.fechaCorte||'').localeCompare(a.p.fechaCorte||''));

  return `<div class="card"><h2>La respuesta corta</h2>
    ${costo > 0 ? (porCien >= 100
      ? `<div class="aviso rojo" style="font-size:15px">
          <b>Estás abonando menos de lo que te cobran.</b> Has pagado <b>${money(abonado)}</b>, pero entre
          intereses, IVA y comisiones el banco te ha cobrado <b>${money(costo)}</b>.
          Ni siquiera alcanzas a cubrir el costo de la deuda: <b>tu saldo crece solo</b>, aunque no vuelvas
          a usar la tarjeta. Para que empiece a bajar necesitas abonar más de
          <b>${money(costo/Math.max(1,mesesConCosto()))}</b> al mes, que es lo que te cuesta en promedio.
        </div>`
      : `<div class="aviso ${porCien>30?'rojo':porCien>15?'ambar':'azul'}" style="font-size:15px">
          De cada <b>$100</b> que has abonado a tus tarjetas, <b>${money(porCien)}</b> se los quedó el banco
          en intereses, IVA y comisiones. Sólo <b>${money(100-porCien)}</b> bajaron tu deuda de verdad.
          ${porCien>30?' Por eso sientes que abonas y no pasa nada: la mayor parte de tu pago ni siquiera toca el capital.':''}
        </div>`) : `<div class="aviso verde">Hasta ahora no tienes intereses ni comisiones capturados.
      Si tus estados de cuenta traen cargos por interés, captúralos como movimientos tipo
      <b>Intereses</b> para que aparezcan aquí.</div>`}

    <div class="grid g4" style="margin-top:14px">
      ${kpi('Total abonado', money(abonado), 'todo lo que has pagado', 'ok')}
      ${kpi('Se lo quedó el banco', money(costo), 'intereses + IVA + comisiones', 'bad')}
      ${kpi(capital>=0?'Bajó tu deuda':'Subió tu deuda', money(capital),
        capital>=0?'abono neto a capital':'lo que creció sola la deuda', capital>0?'ok':'bad')}
      ${kpi('Total comprado', money(compras), 'compras y disposiciones')}
    </div>

    ${abonado > 0 && costo > 0 ? `<div style="margin-top:18px">
      <div class="split">
        <i style="width:${Math.min(100,porCien).toFixed(1)}%;background:var(--bad)">${porCien>12?pct(Math.min(1,costo/abonado)):''}</i>
        <i style="width:${Math.max(0,100-porCien).toFixed(1)}%;background:var(--ok)">${100-porCien>12?pct(1-costo/abonado):''}</i>
      </div>
      <div class="leg"><span>🔴 Intereses y comisiones: <b>${money(costo)}</b></span>
        <span>🟢 Capital: <b>${money(Math.max(0,capital))}</b></span>
        ${capital<0?`<span class="neg"><b>El costo superó tus abonos por ${money(-capital)}</b></span>`:''}</div>
    </div>` : ''}
  </div>

  ${Object.keys(porTipo).length ? `<div class="card"><h2>En qué te cobran</h2>
    <div class="tw"><table>
      <thead><tr><th>Concepto</th><th class="num">Total pagado</th><th class="num">% del costo</th></tr></thead>
      <tbody>${Object.entries(porTipo).sort((a,b)=>b[1]-a[1]).map(([k,v]) => `<tr>
        <td><span class="tag ${TIPOS[k].clase}">${TIPOS[k].etiqueta}</span></td>
        <td class="num neg">${money(v)}</td><td class="num">${pct(v/costo)}</td></tr>`).join('')}
      </tbody></table></div>
  </div>` : ''}

  ${porTarjeta.some(x => x.costo > 0) ? `<div class="card">
    <h2>Cuál tarjeta te está sangrando más</h2>
    <div class="tw"><table>
      <thead><tr><th>Tarjeta</th><th class="num">Debes</th><th class="num">Abonado</th>
        <th class="num">Intereses y cargos</th><th class="num">De cada $100 abonados</th></tr></thead>
      <tbody>${porTarjeta.map(x => `<tr>
        <td><span class="dot" style="background:${x.t.color}"></span>${esc(x.t.nombre)}
          ${x.t.tasaAnual?`<div class="sub">${num(x.t.tasaAnual)}% anual</div>`:''}</td>
        <td class="num">${money(x.saldo)}</td>
        <td class="num pos">${money(x.abonado)}</td>
        <td class="num neg">${money(x.costo)}</td>
        <td class="num ${x.abonado&&x.costo/x.abonado>.3?'neg':''}">
          ${x.abonado>0 ? money(x.costo/x.abonado*100)+' al banco' : '—'}</td></tr>`).join('')}
      </tbody></table></div>
    ${(()=>{ const conCosto = porTarjeta.filter(x => x.costo > 0);
      const peor = conCosto[0];
      if(!peor) return '';
      return `<div class="aviso ambar" style="margin-top:12px">💡 <b>Estrategia:</b>
        ${conCosto.length > 1
          ? `ataca primero <b>${esc(peor.t.nombre)}</b>, que es la que más te ha costado
             (${money(peor.costo)}). Mantén las otras en el pago mínimo y todo el excedente
             mándalo a ésta:`
          : `en <b>${esc(peor.t.nombre)}</b> llevas ${money(peor.costo)} pagados en puro interés.
             Todo excedente que tengas mándalo a esta tarjeta:`}
        cada peso que le abones de más deja de generar intereses de inmediato.</div>`; })()}
  </div>` : ''}

  ${mesesOrd.length ? `<div class="card"><h2>Cuánto te cuesta la deuda cada mes</h2>
    ${mesesOrd.map(k => `<div style="margin-bottom:11px">
      <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px">
        <span>${mesLargo(k)}</span><b class="num neg">${money(porMes[k])}</b></div>
      <div class="mini"><i style="width:${(porMes[k]/maxMes*100).toFixed(1)}%;background:var(--bad)"></i></div>
    </div>`).join('')}
    <p class="sub" style="margin:12px 0 0">Esto es dinero que sale de tu bolsa cada mes sin comprar nada.</p>
  </div>` : ''}

  ${minimos.length ? `<div class="card"><h2>Cortes donde no alcanzó para liquidar</h2>
    <p class="sub" style="margin:0 0 12px">Cada uno de estos cortes generó intereses sobre el saldo
    que quedó, ya sea porque no alcanzó, porque no se pagó o porque el abono llegó después de la
    fecha límite. Si se repiten mes con mes, la deuda no baja aunque estés pagando.</p>
    <div class="tw"><table>
      <thead><tr><th>Tarjeta</th><th>Corte</th><th class="num">Saldo</th><th class="num">Abonaste</th>
        <th class="num">Faltó</th><th>Estado</th></tr></thead>
      <tbody>${minimos.slice(0,15).map(({p,e}) => `<tr>
        <td><span class="dot" style="background:${colTarjeta(p.tarjetaId)}"></span>${esc(nomTarjeta(p.tarjetaId))}</td>
        <td>${fechaCorta(p.fechaCorte)}</td>
        <td class="num">${money(p.saldoNuevo)}</td>
        <td class="num pos">${money(e.pagado)}
          ${e.tardio>0?`<div class="sub">+${money(e.tardio)} tarde</div>`:''}</td>
        <td class="num neg">${money(e.faltante)}</td>
        <td><span class="tag ${e.clase}">${e.etiqueta}</span></td></tr>`).join('')}
      </tbody></table></div>
  </div>` : ''}`;
}
</script>

<script>
/* ==========================================================================
   VISTA: Gastos — en qué categoría se te va el dinero
   Gráficas en SVG puro, sin librerías.
   ========================================================================== */

/* Paleta categórica validada (contraste, daltonismo y modo oscuro).
   El orden es el mecanismo de seguridad: no se cicla ni se generan tonos. */
const SERIES = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300'];
const SERIES_OSC = ['#3987e5','#d95926','#199e70','#c98500','#d55181','#008300'];
const AZUL = '#2a78d6', AZUL_OSC = '#3987e5';
const CRITICO = '#d03b3b';   /* color de estado: reservado para el costo del banco */
const esOscuro = () => matchMedia('(prefers-color-scheme: dark)').matches;
const serie = i => (esOscuro() ? SERIES_OSC : SERIES)[i % 6];

/* Conceptos de compra que todavía no tienen categoría. */
function pendientes(){
  const compras = D.movimientos.filter(m => ['compra','disposicion'].includes(m.tipo) && !m.categoria);
  const porConcepto = {};
  compras.forEach(m => {
    const k = claveConcepto(m.descripcion) || '(sin concepto)';
    (porConcepto[k] = porConcepto[k] || {concepto:m.descripcion||'(sin concepto)', monto:0, n:0});
    porConcepto[k].monto += Math.abs(num(m.monto));
    porConcepto[k].n++;
  });
  return {movs: compras.length,
          monto: compras.reduce((s,m)=>s+Math.abs(num(m.monto)),0),
          conceptos: Object.values(porConcepto).sort((a,b)=>b.monto-a.monto)};
}

let fCortes = {tarjeta:''};
let fGastos = {tarjeta:'', mes:''};
let abiertoClasificar = true;   // la primera vez conviene verlo abierto
let verClasificar = 12;         // cuántos conceptos se listan de golpe

function vGastos(){
  if(!D.movimientos.length)
    return `<div class="card"><h2>En qué gastas</h2>
      ${vacioMsg('Carga movimientos y aquí verás en qué categoría se te va el dinero.')}</div>`;

  const meses = [...new Set(D.movimientos.map(m => (m.fecha||'').slice(0,7)).filter(Boolean))].sort().reverse();
  const enFiltro = m => (!fGastos.tarjeta || m.tarjetaId === fGastos.tarjeta) &&
                        (!fGastos.mes || (m.fecha||'').startsWith(fGastos.mes));
  const movs = D.movimientos.filter(enFiltro);
  const compras = movs.filter(m => ['compra','disposicion'].includes(m.tipo));
  const costo = movs.filter(m => TIPOS_COSTO.includes(m.tipo))
    .reduce((s,m)=>s+Math.abs(num(m.monto)),0);

  /* Gasto por categoría, más el costo del banco como su propia fila. */
  const porCat = {};
  compras.forEach(m => { const c = m.categoria || 'Sin clasificar';
    (porCat[c] = porCat[c] || {monto:0, n:0}); porCat[c].monto += Math.abs(num(m.monto)); porCat[c].n++; });
  let filas = Object.entries(porCat).map(([cat,v]) => ({cat, ...v, banco:false}));
  if(costo > 0) filas.push({cat:'Intereses y comisiones', monto:costo, banco:true,
    n: movs.filter(m => TIPOS_COSTO.includes(m.tipo)).length});
  filas.sort((a,b) => b.monto - a.monto);
  const total = filas.reduce((s,f)=>s+f.monto, 0);
  const gastoCompras = compras.reduce((s,m)=>s+Math.abs(num(m.monto)),0);
  /* "Sin clasificar" no es una categoría: es trabajo pendiente. */
  const top = filas.find(f => !f.banco && f.cat !== 'Sin clasificar');
  const pend = pendientes();

  /* Meses reales cubiertos, para el promedio mensual. */
  const nMeses = fGastos.mes ? 1 : Math.max(1, new Set(movs.map(m=>(m.fecha||'').slice(0,7)).filter(Boolean)).size);

  return `
  <div class="card"><h2>En qué gastas <span class="sp"></span>
    <select style="width:auto" onchange="fGastos.tarjeta=this.value;render()">
      ${selTarjetas(fGastos.tarjeta, 'Todas las tarjetas')}</select>
    <select style="width:auto" onchange="fGastos.mes=this.value;render()">
      ${opciones(meses.map(m=>({v:m,t:mesLargo(m)})), fGastos.mes, 'Todo el histórico')}</select>
  </h2>
  <div class="grid g4">
    ${kpi('Gasto en compras', money(gastoCompras), `${compras.length} cargos en ${nMeses} mes(es)`)}
    ${kpi('Tu categoría #1', top ? esc(top.cat) : '—',
      top ? `${money(top.monto)} · ${pct(top.monto/total)} de todo` : '', 'warn')}
    ${kpi('Costo del banco', money(costo), costo>0?`${pct(costo/total)} de todo lo que sale`:'sin intereses', costo>0?'bad':'ok')}
    ${kpi('Promedio mensual', money(total/nMeses), 'compras + intereses')}
  </div>
  </div>

  ${pend.movs ? `<details class="card" ${abiertoClasificar ? 'open' : ''} ontoggle="abiertoClasificar=this.open">
    <summary><span>⚠️ Por clasificar</span>
      <span class="sub">${pend.conceptos.length} conceptos · ${pend.movs} movimientos · ${money(pend.monto)}</span>
    </summary>
    <p class="sub" style="margin:14px 0;max-width:720px">Ordenados por lo que más pesa. Elige la
    categoría de cada concepto y se aplica a <b>todos</b> sus movimientos de golpe. Además guardo la
    regla: el próximo estado de cuenta que traiga ese concepto ya llegará clasificado.</p>
    <div class="tw"><table>
      <thead><tr><th>Concepto</th><th class="num">Movs</th><th class="num">Monto</th><th style="width:190px">Categoría</th></tr></thead>
      <tbody>${pend.conceptos.slice(0, verClasificar).map(c => `<tr>
        <td>${esc(c.concepto)}</td>
        <td class="num">${c.n}</td>
        <td class="num">${money(c.monto)}</td>
        <td><select data-con="${esc(c.concepto)}" onchange="clasificarConcepto(this)">
          ${opciones(CATEGORIAS(), '', 'Elegir…')}<option value="__nueva">＋ Nueva categoría…</option>
        </select></td></tr>`).join('')}</tbody></table></div>
    ${pend.conceptos.length > verClasificar ? `<button class="btn sm ghost" style="margin-top:12px"
      onclick="verClasificar += 25; render()">Ver ${Math.min(25, pend.conceptos.length - verClasificar)} más
      (faltan ${pend.conceptos.length - verClasificar})</button>` : ''}
  </details>` : `<div class="card"><div class="aviso verde" style="margin:0">✅ Todos tus movimientos
    están clasificados. Cuando importes un estado de cuenta nuevo, los conceptos que ya conozco
    llegarán categorizados solos.</div></div>`}

  ${filas.length ? `<div class="card"><h2>Gasto por categoría</h2>
    ${barrasCategorias(filas, total)}
    <div class="tw" style="margin-top:18px"><table>
      <thead><tr><th>Categoría</th><th class="num">Monto</th><th class="num">% del total</th>
        <th class="num">Movs</th><th class="num">Promedio</th><th class="num">Al mes</th></tr></thead>
      <tbody>${filas.map(f => `<tr>
        <td>${f.banco ? '⚠️ ' : `<span class="dot" style="background:${AZUL}"></span>`}${esc(f.cat)}</td>
        <td class="num ${f.banco?'neg':''}">${money(f.monto)}</td>
        <td class="num">${pct(f.monto/total)}</td>
        <td class="num">${f.n}</td>
        <td class="num">${money(f.monto/f.n)}</td>
        <td class="num">${money(f.monto/nMeses)}</td></tr>`).join('')}
        <tr><td><b>Total</b></td><td class="num"><b>${money(total)}</b></td><td class="num">100%</td>
          <td class="num"><b>${filas.reduce((s,f)=>s+f.n,0)}</b></td><td></td>
          <td class="num"><b>${money(total/nMeses)}</b></td></tr>
      </tbody></table></div>
  </div>` : ''}

  ${!fGastos.mes && meses.length > 1 ? `<div class="card">
    <h2>Cómo cambia mes a mes</h2>
    ${columnasMensuales(D.movimientos.filter(m => !fGastos.tarjeta || m.tarjetaId === fGastos.tarjeta))}
  </div>` : ''}

  ${(()=>{ const porCom = {};
    compras.forEach(m => { const k = claveConcepto(m.descripcion);
      (porCom[k] = porCom[k] || {c:m.descripcion, monto:0, n:0, cat:m.categoria});
      porCom[k].monto += Math.abs(num(m.monto)); porCom[k].n++; });
    const lista = Object.values(porCom).sort((a,b)=>b.monto-a.monto).slice(0,15);
    return lista.length ? `<div class="card"><h2>Dónde gastas más <span class="sub">top 15 comercios</span></h2>
      <div class="tw"><table>
        <thead><tr><th>Comercio</th><th>Categoría</th><th class="num">Veces</th>
          <th class="num">Total</th><th class="num">Promedio</th></tr></thead>
        <tbody>${lista.map(x => `<tr>
          <td>${esc(x.c)}</td>
          <td>${x.cat ? `<span class="tag gris">${esc(x.cat)}</span>` : '<span class="sub">sin clasificar</span>'}</td>
          <td class="num">${x.n}</td><td class="num">${money(x.monto)}</td>
          <td class="num">${money(x.monto/x.n)}</td></tr>`).join('')}</tbody></table></div>
    </div>` : ''; })()}`;
}

/* ── Gráfica 1: barras horizontales, gasto por categoría ───────────────────
   El trabajo es comparar magnitud, así que un solo tono y la longitud carga
   el dato. El costo del banco va en color de estado con su icono y etiqueta,
   porque no es un gasto tuyo: es lo que cuesta deber. */
function barrasCategorias(filas, total){
  const max = Math.max(...filas.map(f => f.monto), 1);
  return `<div class="chart" role="img"
      aria-label="Gasto por categoría. ${filas.map(f=>`${f.cat}: ${money(f.monto)}`).join('. ')}">
    ${filas.map(f => {
      const w = (f.monto / max * 100).toFixed(2);
      const col = f.banco ? 'var(--critico)' : 'var(--serie1)';
      return `<div class="brow" tabindex="0"
          data-tip="${esc(f.cat)} · ${money(f.monto)} · ${pct(f.monto/total)} del total · ${f.n} movimiento${f.n===1?'':'s'}">
        <div class="blab">${f.banco ? '⚠️ ' : ''}${esc(f.cat)}</div>
        <div class="btrack"><i style="width:${w}%;background:${col}"></i></div>
        <div class="bval">${money(f.monto)}</div>
      </div>`;
    }).join('')}
  </div>
  <p class="sub" style="margin:12px 0 0">Los montos van etiquetados en cada barra y repetidos en la
  tabla de abajo: el color nunca es lo único que distingue un dato.</p>`;
}

/* ── Gráfica 2: columnas apiladas por mes ──────────────────────────────────
   Cinco categorías principales más "Otros": seis series es el tope al que la
   paleta sigue siendo distinguible con daltonismo. */
function columnasMensuales(movs){
  const compras = movs.filter(m => ['compra','disposicion'].includes(m.tipo));
  const meses = [...new Set(compras.map(m => (m.fecha||'').slice(0,7)).filter(Boolean))].sort().slice(-12);
  if(meses.length < 2) return '<p class="sub">Necesitas al menos dos meses con movimientos.</p>';

  const tot = {};
  compras.forEach(m => { const c = m.categoria || 'Sin clasificar';
    tot[c] = (tot[c]||0) + Math.abs(num(m.monto)); });
  const top = Object.entries(tot).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x => x[0]);
  const cats = [...top, 'Otros'];

  const datos = meses.map(ym => {
    const fila = {mes:ym, vals:{}, total:0};
    cats.forEach(c => fila.vals[c] = 0);
    compras.filter(m => (m.fecha||'').startsWith(ym)).forEach(m => {
      const c = m.categoria || 'Sin clasificar';
      const dest = top.includes(c) ? c : 'Otros';
      fila.vals[dest] += Math.abs(num(m.monto)); fila.total += Math.abs(num(m.monto));
    });
    return fila;
  });
  const max = Math.max(...datos.map(d => d.total), 1);

  return `<div class="leyenda">${cats.map((c,i) =>
      `<span><i style="background:${serie(i)}"></i>${esc(c)}</span>`).join('')}</div>
    <div class="cols" role="img" aria-label="Gasto por categoría en cada mes. ${
      datos.map(d=>`${mesLargo(d.mes)}: ${money(d.total)}`).join('. ')}">
      ${datos.map(d => `<div class="col">
        <div class="cval">${money(d.total)}</div>
        <div class="cstack" style="height:${Math.max(28, d.total/max*210).toFixed(0)}px">
          ${cats.map((c,i) => d.vals[c] > 0 ? `<i style="flex:${d.vals[c]};background:${serie(i)}"
              tabindex="0" data-tip="${mesLargo(d.mes)} · ${esc(c)} · ${money(d.vals[c])} · ${pct(d.vals[c]/d.total)} del mes"
              aria-label="${mesLargo(d.mes)}, ${esc(c)}, ${money(d.vals[c])}"></i>` : '').join('')}
        </div>
        <div class="clab">${mesLargo(d.mes).replace(' 20',' ')}</div>
      </div>`).join('')}
    </div>
    <div class="tw" style="margin-top:16px"><table>
      <thead><tr><th>Mes</th>${cats.map(c=>`<th class="num">${esc(c)}</th>`).join('')}<th class="num">Total</th></tr></thead>
      <tbody>${datos.slice().reverse().map(d => `<tr><td>${mesLargo(d.mes)}</td>
        ${cats.map(c=>`<td class="num">${d.vals[c]?money(d.vals[c]):'—'}</td>`).join('')}
        <td class="num"><b>${money(d.total)}</b></td></tr>`).join('')}</tbody></table></div>`;
}

function clasificarConcepto(el){
  const concepto = el.dataset.con, cat = el.value;
  if(!cat) return;
  if(cat === '__nueva'){ el.value=''; nuevaCategoria(nom => { el.value = nom; clasificarConcepto(el); }); return; }
  const n = aplicarAConcepto(concepto, cat);
  render();
  aviso(`${n} movimiento${n===1?'':'s'} de ${concepto} → ${cat} ✓`);
}
</script>

<script>
/* ==========================================================================
   VISTA: Datos — respaldo, importación y carga de estados de cuenta
   ========================================================================== */
function vDatos(){
  const peso = new Blob([JSON.stringify(D)]).size;
  return `<div class="card"><h2>Cargar un estado de cuenta ya vaciado</h2>
    <p class="sub" style="margin:0 0 13px;max-width:720px">Pega aquí el JSON con los movimientos de un corte.
    Es el formato que uso cuando me pasas el PDF de tu estado de cuenta y lo vacío por ti:
    da de alta el corte y todos sus movimientos de un jalón, sin que captures nada a mano.</p>
    <textarea id="pegado" style="min-height:150px;font-family:var(--mono);font-size:12px"
      placeholder='{"tipo":"estado_de_cuenta","tarjeta":"BBVA Azul", ...}'></textarea>
    <div style="display:flex;gap:9px;margin-top:11px;flex-wrap:wrap">
      <button class="btn" onclick="importarPegado()">Cargar al registro</button>
      <button class="btn ghost" onclick="verFormato()">Ver el formato</button>
      <button class="btn ghost" onclick="cargarEjemplo()">Probar con datos de ejemplo</button>
    </div>
  </div>

  <div class="card"><h2>Respaldo</h2>
    <p class="sub" style="margin:0 0 13px;max-width:720px">Tus datos viven en este navegador. Si borras el
    historial o cambias de dispositivo se pierden, así que <b>exporta tu respaldo seguido</b> y guárdalo
    donde quieras. El archivo que baja es el mismo que puedes volver a importar aquí.</p>
    <div style="display:flex;gap:9px;flex-wrap:wrap">
      <button class="btn" onclick="exportar()">⬇ Exportar respaldo JSON</button>
      <button class="btn ghost" onclick="$('archivo').click()">⬆ Importar respaldo</button>
      <button class="btn ghost" onclick="exportarCSV()">⬇ Movimientos en CSV</button>
      <input type="file" id="archivo" accept=".json,application/json" class="hide" onchange="importarArchivo(this)">
    </div>
    <div class="grid g4" style="margin-top:16px">
      ${kpi('Tarjetas', String(D.tarjetas.length))}
      ${kpi('Movimientos', String(D.movimientos.length))}
      ${kpi('Estados de cuenta', String(D.periodos.length))}
      ${kpi('Ingresos', String(D.ingresos.length))}
    </div>
    <p class="sub" style="margin:13px 0 0">Último guardado: ${fechaCorta(D.actualizado)} ·
      ${(peso/1024).toFixed(1)} KB usados</p>
  </div>

  <div class="card"><h2>Zona de riesgo</h2>
    <p class="sub" style="margin:0 0 13px">Borra todo y empieza de cero. Exporta tu respaldo antes.</p>
    <button class="btn danger" onclick="borrarTodo()">Borrar todos mis datos</button>
  </div>`;
}

function exportar(){
  const blob = new Blob([JSON.stringify(D, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `tarjetas-respaldo-${hoyISO()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  aviso('Respaldo descargado ✓');
}
function exportarCSV(){
  const filas = [['Fecha','Tarjeta','Concepto','Categoria','Tipo','Monto','Efecto','MSI','Nota']];
  ordenados(D.movimientos).forEach(m => filas.push([
    m.fecha, nomTarjeta(m.tarjetaId), m.descripcion||'', m.categoria||'',
    (TIPOS[m.tipo]||{}).etiqueta || m.tipo, Math.abs(num(m.monto)).toFixed(2),
    (TIPOS[m.tipo]||{}).suma > 0 ? 'cargo' : (esPago(m) ? 'abono' : 'ajuste'), m.msi||'', m.nota||'']));
  const csv = '﻿' + filas.map(f => f.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = `movimientos-${hoyISO()}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  aviso('CSV descargado ✓');
}
function importarArchivo(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { try{ importar(JSON.parse(r.result)); }
                     catch(e){ aviso('El archivo no es un JSON válido'); } };
  r.readAsText(f);
  input.value = '';
}
function importarPegado(){
  const txt = $('pegado').value.trim();
  if(!txt) return aviso('Pega primero el JSON');
  try{ importar(JSON.parse(txt)); $('pegado').value = ''; }
  catch(e){ aviso('El JSON tiene un error de sintaxis: ' + e.message, 4500); }
}

/* Acepta un respaldo completo, un lote de estado de cuenta o un arreglo de lotes. */
function importar(obj){
  if(Array.isArray(obj)){ obj.forEach(o => aplicarLote(o)); refrescar(); return; }
  if(obj && Array.isArray(obj.tarjetas) && (obj.movimientos || obj.periodos)){
    const res = `<b>${obj.tarjetas.length}</b> tarjeta(s), <b>${(obj.movimientos||[]).length}</b> movimiento(s),
      <b>${(obj.periodos||[]).length}</b> estado(s) de cuenta y <b>${(obj.ingresos||[]).length}</b> ingreso(s)`;
    modal('Importar respaldo', `<p style="margin:0 0 14px;line-height:1.6">El archivo trae ${res}.
      ¿Cómo lo quieres importar?</p>
      <div class="aviso azul" style="margin:0">Tus datos actuales: ${D.tarjetas.length} tarjetas,
      ${D.movimientos.length} movimientos, ${D.periodos.length} estados de cuenta.</div>`, [
      {texto:'Cancelar', accion:cerrarModal},
      {texto:'Agregar a lo que ya tengo', accion:()=>{
        (obj.tarjetas||[]).forEach(t => { if(!D.tarjetas.some(x => x.id === t.id)) D.tarjetas.push(t); });
        ['movimientos','periodos','ingresos'].forEach(k =>
          (obj[k]||[]).forEach(x => { if(!D[k].some(y => y.id === x.id)) D[k].push(x); }));
        cerrarModal(); refrescar(); aviso('Datos agregados ✓');
      }},
      {texto:'Reemplazar todo', clase:'danger', accion:()=>{
        D = Object.assign(estadoVacio(), obj);
        cerrarModal(); refrescar(); aviso('Datos reemplazados ✓');
      }},
    ]);
    return;
  }
  if(obj && (obj.tipo === 'estado_de_cuenta' || obj.movimientos || obj.periodo)){
    aplicarLote(obj); refrescar(); return;
  }
  aviso('No reconozco ese formato. Revisa "Ver el formato".', 4000);
}

/* Carga un corte completo: crea la tarjeta si no existe, el periodo y sus movimientos.
   Salta los movimientos que ya estaban capturados para no duplicar. */
function aplicarLote(lote){
  if(!lote || typeof lote !== 'object') return;
  const nombre = String(lote.tarjeta || lote.nombreTarjeta || '').trim();
  let t = D.tarjetas.find(x => x.id === lote.tarjetaId) ||
          D.tarjetas.find(x => x.nombre.toLowerCase() === nombre.toLowerCase());
  if(!t){
    if(!nombre) return aviso('El lote no dice a qué tarjeta pertenece', 4000);
    t = {id:uid(), nombre, banco:lote.banco||'', ultimos4:lote.ultimos4||'',
         color:COLORES[D.tarjetas.length % COLORES.length],
         limite:num(lote.limite), tasaAnual:num(lote.tasaAnual),
         diaCorte:num(lote.diaCorte), diasParaPagar:num(lote.diasParaPagar)||20, creado:hoyISO()};
    D.tarjetas.push(t);
  }
  /* Datos de la tarjeta que traiga el lote. Los estados de cuenta se cargan en
     orden, así que el más reciente deja el límite y la tasa vigentes. */
  ['limite','tasaAnual','diaCorte','diasParaPagar'].forEach(k => { if(num(lote[k])) t[k] = num(lote[k]); });
  ['banco','ultimos4'].forEach(k => { if(!t[k] && lote[k]) t[k] = lote[k]; });

  let nuevosMovs = 0, nuevosCortes = 0, repetidos = 0;
  /* `periodo` es el nombre bueno; se acepta `corte` como alias sólo si viene
     como objeto, para no confundirlo con el `corte` de cada movimiento. */
  const p = lote.periodo || (lote.corte && typeof lote.corte === 'object' ? lote.corte : null);
  if(p && p.fechaCorte){
    const ya = D.periodos.find(x => x.tarjetaId === t.id && x.fechaCorte === p.fechaCorte);
    const obj = {tarjetaId:t.id, fechaCorte:p.fechaCorte,
      fechaLimitePago: p.fechaLimitePago || sumaDias(p.fechaCorte, num(t.diasParaPagar)||20),
      saldoAnterior:num(p.saldoAnterior), saldoNuevo:num(p.saldoNuevo),
      pagoMinimo:num(p.pagoMinimo), pagoNoIntereses:num(p.pagoNoIntereses),
      saldoDiferido:num(p.saldoDiferido),
      pagoMinimoConMeses:num(p.pagoMinimoConMeses), nota:p.nota||''};
    if(ya) Object.assign(ya, obj);
    else { D.periodos.push(Object.assign({id:uid(), creado:hoyISO()}, obj)); nuevosCortes++; }
  }
  /* Un mismo día puede traer dos cargos idénticos de verdad (dos suscripciones
     del mismo precio). Por eso no basta con preguntar "¿ya existe uno igual?":
     contamos cuántos hay ya y cuántos trae el lote, y sólo saltamos el traslape. */
  const clave = x => [x.fecha, Math.abs(num(x.monto)).toFixed(2), x.descripcion||''].join('|');
  const yaHay = {};
  D.movimientos.filter(x => x.tarjetaId === t.id)
    .forEach(x => { const k = clave(x); yaHay[k] = (yaHay[k]||0) + 1; });
  const vistos = {};
  (lote.movimientos || []).forEach(m => {
    const fecha = String(m.fecha||'').slice(0,10);
    const monto = Math.abs(num(m.monto));
    if(!fecha || !monto) return;
    const tipo = TIPOS[m.tipo] ? m.tipo : (num(m.monto) < 0 ? 'abono' : 'compra');
    /* Si ya clasificaste este concepto antes, la importación lo respeta. */
    const cat = m.categoria || D.reglas[claveConcepto(m.descripcion)] || '';
    const k = clave({fecha, monto, descripcion:m.descripcion});
    vistos[k] = (vistos[k]||0) + 1;
    if(vistos[k] <= (yaHay[k]||0)){ repetidos++; return; }
    D.movimientos.push({id:uid(), tarjetaId:t.id, fecha, descripcion:m.descripcion||'',
      tipo, monto, categoria:cat, msi:m.msi||'', nota:m.nota||'',
      corte: m.corte || (p && p.fechaCorte) || '', creado:new Date().toISOString()});
    nuevosMovs++;
  });
  (lote.ingresos || []).forEach(i => {
    if(!num(i.monto)) return;
    D.ingresos.push({id:uid(), fecha:String(i.fecha||hoyISO()).slice(0,10), monto:Math.abs(num(i.monto)),
      concepto:i.concepto||'', fuente:i.fuente||'', nota:i.nota||''});
  });
  aviso(`✓ ${t.nombre}: ${nuevosCortes} corte, ${nuevosMovs} movimientos` +
        (repetidos ? ` (${repetidos} ya estaban)` : ''), 4200);
}

/* ---------- Tooltip de las gráficas ----------
   Un solo listener delegado: sirve para las barras, las columnas y cualquier
   cosa que lleve data-tip, sin registrar un manejador por elemento. */
(function(){
  const tip = $('tip');
  const mostrar = (el, x, y) => {
    tip.textContent = el.dataset.tip;
    tip.classList.add('on');
    const r = tip.getBoundingClientRect();
    tip.style.left = Math.min(Math.max(8, x - r.width/2), innerWidth - r.width - 8) + 'px';
    tip.style.top  = (y - r.height - 12 < 8 ? y + 18 : y - r.height - 12) + 'px';
  };
  const ocultar = () => tip.classList.remove('on');
  document.addEventListener('mousemove', e => {
    const el = e.target.closest('[data-tip]');
    if(el) mostrar(el, e.clientX, e.clientY); else ocultar();
  });
  /* Con teclado el tooltip también aparece: la gráfica es navegable con tab. */
  document.addEventListener('focusin', e => {
    const el = e.target.closest('[data-tip]');
    if(!el) return ocultar();
    const r = el.getBoundingClientRect();
    mostrar(el, r.left + r.width/2, r.top);
  });
  document.addEventListener('focusout', ocultar);
  addEventListener('scroll', ocultar, true);
})();
